<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 95 800 400" width="800" height="400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mapa ilustrado de Eslovenia">
<defs>
  <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0E2A28"/><stop offset="1" stop-color="#0A1F1D"/></linearGradient>
  <linearGradient id="tierra" x1="0.1" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#2A6157"/><stop offset="0.55" stop-color="#1D4A44"/>
    <stop offset="1" stop-color="#163B37"/></linearGradient>
  <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6FD8CD"/><stop offset="1" stop-color="#2C7C76"/></linearGradient>
  <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#000" flood-opacity=".5"/></filter>
  <clipPath id="pais"><path d="M110 210 Q143 200 176 203 Q209 215 241 225 Q301 203 362 185
    Q411 171 460 160 Q509 168 558 180 Q619 158 679 140 Q717 127 755 118 Q774 150 793 185
    Q768 213 744 240 Q742 294 740 348 Q682 373 624 398 Q616 417 609 436 Q567 446 526 456
    Q476 464 427 471 Q367 460 307 448 Q265 465 224 481 Q189 475 154 469 Q156 433 158 398
    Q145 364 132 331 Q146 302 160 273 Q135 241 110 210 Z"/></clipPath>
</defs>

<rect width="900" height="620" fill="url(#cielo)"/>
<g fill="#EAF0EC" opacity=".05">
  <ellipse cx="200" cy="66" rx="120" ry="24"/><ellipse cx="278" cy="54" rx="72" ry="17"/>
  <ellipse cx="690" cy="72" rx="128" ry="22"/></g>

<!-- mar Adriático -->
<path d="M0 430 Q70 424 132 452 Q120 500 154 469 L154 620 L0 620 Z" fill="#1B4C4E" opacity=".8"/>
<g stroke="#4FC3B8" stroke-width="2.2" opacity=".38" stroke-linecap="round" fill="none">
  <path d="M18 512 q16 -7 32 0 t32 0"/><path d="M34 550 q16 -7 32 0 t32 0"/>
  <path d="M14 582 q16 -7 32 0 t32 0"/></g>
<text x="60" y="604" font-family="ui-monospace,Menlo,monospace" font-size="11"
      letter-spacing="3" fill="#4FC3B8" opacity=".5">ADRIÁTICO</text>

<!-- ══ ESLOVENIA ══ -->
<g filter="url(#sombra)">
<path d="M110 210 Q143 200 176 203 Q209 215 241 225 Q301 203 362 185
         Q411 171 460 160 Q509 168 558 180 Q619 158 679 140 Q717 127 755 118
         Q774 150 793 185 Q768 213 744 240 Q742 294 740 348 Q682 373 624 398
         Q616 417 609 436 Q567 446 526 456 Q476 464 427 471 Q367 460 307 448
         Q265 465 224 481 Q189 475 154 469 Q156 433 158 398 Q145 364 132 331
         Q146 302 160 273 Q135 241 110 210 Z"
      fill="url(#tierra)" stroke="#4FC3B8" stroke-width="2.4" stroke-opacity=".6"/>
</g>

<g clip-path="url(#pais)">
  <!-- Alpes Julianos, noroeste -->
  <path d="M120 300 L186 196 L252 300 Z" fill="#357A6E"/>
  <path d="M186 196 L214 240 L158 240 Z" fill="#EAF0EC" opacity=".92"/>
  <path d="M164 320 L226 224 L288 320 Z" fill="#2E6B62"/>
  <path d="M226 224 L250 262 L202 262 Z" fill="#EAF0EC" opacity=".78"/>
  <path d="M262 300 L318 216 L374 300 Z" fill="#28605A"/>
  <path d="M318 216 L340 250 L296 250 Z" fill="#EAF0EC" opacity=".6"/>
  <!-- Kamnik-Savinja, centro-norte -->
  <path d="M340 280 L392 206 L444 280 Z" fill="#2A665D" opacity=".9"/>
  <path d="M392 206 L412 236 L372 236 Z" fill="#EAF0EC" opacity=".55"/>
  <!-- colinas del este -->
  <g fill="#276057" opacity=".75">
    <path d="M540 250 q34 -34 68 0 z"/><path d="M600 276 q30 -28 60 0 z"/>
    <path d="M660 236 q32 -30 64 0 z"/><path d="M700 296 q28 -26 56 0 z"/></g>
  <g fill="#1D4A44">
    <path d="M566 232 l9 -20 l9 20 z"/><path d="M628 258 l8 -18 l8 18 z"/>
    <path d="M690 220 l9 -20 l9 20 z"/><path d="M714 282 l8 -17 l8 17 z"/></g>
  <!-- bosques del sur, Kočevje -->
  <g fill="#194540">
    <path d="M400 430 l10 -22 l10 22 z"/><path d="M424 444 l9 -20 l9 20 z"/>
    <path d="M448 428 l10 -21 l10 21 z"/><path d="M376 446 l9 -19 l9 19 z"/></g>
</g>

<!-- río Soča -->
<path d="M180 224 C168 262 190 286 176 318 C160 352 186 376 172 404"
      stroke="#8FE5DC" stroke-width="6.5" fill="none" stroke-linecap="round" opacity=".9"/>
<text x="150" y="352" font-family="ui-monospace,Menlo,monospace" font-size="9.5"
      letter-spacing="2" fill="#8FE5DC" opacity=".85" transform="rotate(-76 150 352)">SOČA</text>

<!-- Triglav -->
<text x="200" y="188" font-family="ui-monospace,Menlo,monospace" font-size="10"
      letter-spacing="2" fill="#EAF0EC" opacity=".85" text-anchor="middle">TRIGLAV</text>

<!-- lago Bled, con isla e iglesia -->
<ellipse cx="265" cy="243" rx="27" ry="12" fill="url(#agua)"/>
<ellipse cx="267" cy="242" rx="8" ry="4" fill="#1D4A44"/>
<path d="M265 238 v-11 h5 v11 z" fill="#0E2A28"/>
<path d="M263.5 227 l4 -8 l4 8 z" fill="#D9A233"/>
<path d="M243 236 c6 -2 16 -2 22 0 -4 4 -18 4 -22 0 z" fill="#0E2A28"/>
<text x="265" y="212" font-family="ui-monospace,Menlo,monospace" font-size="9.5"
      letter-spacing="2" fill="#8FE5DC" text-anchor="middle">BLED</text>

<!-- lago Bohinj -->
<ellipse cx="215" cy="266" rx="25" ry="9" fill="url(#agua)" opacity=".8"/>
<text x="213" y="286" font-family="ui-monospace,Menlo,monospace" font-size="9"
      letter-spacing="2" fill="#8FE5DC" opacity=".8" text-anchor="middle">BOHINJ</text>

<!-- Liubliana: castillo y puente del dragón -->
<g transform="translate(353,323)">
  <circle r="24" fill="#0E2A28" opacity=".5"/>
  <path d="M-15 3 v-14 h5 v-6 h6 v6 h7 v-6 h5 v6 h6 v14 z" fill="#D9A233"/>
  <path d="M-4 3 v-8 h8 v8 z" fill="#0E2A28"/>
  <path d="M-19 11 q19 -9 38 0" stroke="#EAF0EC" stroke-width="2.2" fill="none" opacity=".7"/>
</g>
<circle cx="353" cy="323" r="5.5" fill="#D9A233"/>
<text x="353" y="366" font-family="-apple-system,Helvetica,sans-serif" font-size="13"
      font-weight="700" letter-spacing="2" fill="#EAF0EC" text-anchor="middle">LIUBLIANA</text>

<!-- karst: cueva -->
<g transform="translate(258,404)">
  <path d="M-28 18 C-28 -3 -13 -15 0 -15 C13 -15 28 -3 28 18 Z" fill="#0A1F1D"/>
  <g fill="#6FD8CD" opacity=".6">
    <path d="M-16 -10 l3.5 13 l3.5 -13 z"/><path d="M-3 -12 l3.5 16 l3.5 -16 z"/>
    <path d="M11 -8 l3.5 12 l3.5 -12 z"/></g>
  <g fill="#2C7C76" opacity=".75">
    <path d="M-10 18 l3.5 -10 l3.5 10 z"/><path d="M7 18 l3.5 -12 l3.5 12 z"/></g>
</g>
<text x="258" y="440" font-family="ui-monospace,Menlo,monospace" font-size="9"
      letter-spacing="2" fill="#8FA8A2" text-anchor="middle">KARST</text>

<!-- Pirán -->
<g transform="translate(147,449)">
  <path d="M0 0 v-19 l3.5 -7 l3.5 7 v19 z" fill="#EAF0EC" opacity=".88"/>
  <rect x="-12" y="-7" width="9" height="9" fill="#C0503F" opacity=".9"/>
  <rect x="9" y="-5" width="8" height="7" fill="#C0503F" opacity=".72"/>
</g>
<text x="140" y="470" font-family="ui-monospace,Menlo,monospace" font-size="9"
      letter-spacing="2" fill="#EAF0EC" opacity=".7" text-anchor="middle">PIRÁN</text>

<!-- viñedos del este -->
<g transform="translate(712,210)">
  <g fill="#9C5885"><circle cx="0" cy="0" r="4"/><circle cx="8" cy="3" r="4"/>
    <circle cx="4" cy="8" r="4"/><circle cx="-6" cy="5" r="3.4"/></g>
  <path d="M2 -6 q6 -6 13 -4" stroke="#7FB069" stroke-width="2.4" fill="none"/></g>
<g transform="translate(668,254)" opacity=".72">
  <g fill="#9C5885"><circle cx="0" cy="0" r="3.4"/><circle cx="7" cy="3" r="3.4"/>
    <circle cx="3" cy="7" r="3.4"/></g></g>
<text x="700" y="188" font-family="ui-monospace,Menlo,monospace" font-size="9"
      letter-spacing="2" fill="#C08FB4" opacity=".8" text-anchor="middle">VIÑEDOS</text>

<!-- oso, en los bosques del sur -->
<g transform="translate(432,462)" opacity=".8">
  <ellipse cx="0" cy="0" rx="15" ry="9.5" fill="#0A1F1D"/>
  <circle cx="-13" cy="-5" r="7" fill="#0A1F1D"/>
  <circle cx="-17" cy="-10.5" r="2.7" fill="#0A1F1D"/>
  <circle cx="-9.5" cy="-11.5" r="2.7" fill="#0A1F1D"/>
  <circle cx="-17.5" cy="-4" r="1.5" fill="#6FD8CD"/></g>

<!-- ── LA RUTA ── -->
<polyline points="239,421 270,381 147,453 182,291 187,228 265,243 215,266 353,323 373,238"
          fill="none" stroke="#D9A233" stroke-width="2.2" stroke-dasharray="4 6"
          stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
<g fill="#D9A233">
  <circle cx="239" cy="421" r="4"/><circle cx="270" cy="381" r="4"/>
  <circle cx="147" cy="453" r="4"/><circle cx="182" cy="291" r="4"/>
  <circle cx="187" cy="228" r="4"/><circle cx="265" cy="243" r="4"/>
  <circle cx="215" cy="266" r="4"/><circle cx="353" cy="323" r="4"/>
  <circle cx="373" cy="238" r="4"/></g>

<!-- vecinos -->
<g font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="4"
   fill="#8FA8A2" opacity=".45">
  <text x="440" y="126" text-anchor="middle">AUSTRIA</text>
  <text x="840" y="132" text-anchor="middle">HUNGRÍA</text>
  <text x="470" y="524" text-anchor="middle">CROACIA</text>
  <text x="46" y="330">ITALIA</text></g>

<!-- norte -->
<g transform="translate(846,440)" opacity=".5">
  <circle r="19" fill="none" stroke="#4FC3B8" stroke-width="1.2"/>
  <path d="M0 -19 L4.5 0 L0 19 L-4.5 0 Z" fill="#4FC3B8"/>
  <text x="0" y="-25" font-family="ui-monospace,Menlo,monospace" font-size="9"
        fill="#8FE5DC" text-anchor="middle">N</text></g>
</svg>
