<style>
:root{
  --karst:#0E2A28;        /* fondo profundo, roca kárstica */
  --karst-2:#163B37;      /* superficie elevada */
  --soca:#4FC3B8;         /* turquesa del río Soča */
  --soca-dim:#2C7C76;
  --panel:#D9A233;        /* ocre de las colmenas eslovenas */
  --panel-red:#C0503F;    /* rojo de las colmenas */
  --paper:#EAF0EC;        /* texto principal */
  --paper-dim:#8FA8A2;    /* texto secundario */
  --line:rgba(79,195,184,.18);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--karst);
  color:var(--paper);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
a{color:var(--soca);text-decoration:none}
:focus-visible{outline:2px solid var(--panel);outline-offset:2px;border-radius:4px}

/* ---------- Cabecera ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--karst) 72%,transparent);
  padding:calc(14px + env(safe-area-inset-top)) 20px 18px;
}
.volver{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--paper-dim);text-decoration:none;margin:0 0 12px;
  padding:5px 11px 5px 8px;border:1px solid var(--line);border-radius:999px}
.volver:active{color:var(--soca)}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--soca-dim);margin:0 0 4px;
}
h1{
  font-size:27px;line-height:1.12;letter-spacing:-.025em;
  font-weight:800;margin:0;
}
.sub{color:var(--paper-dim);font-size:14px;margin:6px 0 0}

/* ---------- Contenido ---------- */
main{padding:0 20px 32px;max-width:640px;margin:0 auto}
.view{display:none;animation:in .22s ease-out}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* ---------- Línea del río: timeline ---------- */
.river{position:relative;margin:8px 0 0;padding-left:28px}
.river::before{
  content:"";position:absolute;left:7px;top:8px;bottom:8px;width:3px;
  background:linear-gradient(180deg,var(--soca),var(--soca-dim));
  border-radius:3px;opacity:.55;
}
.stop{position:relative;padding:0 0 22px}
.stop::before{
  content:"";position:absolute;left:-25px;top:7px;width:11px;height:11px;
  border-radius:50%;background:var(--karst);border:3px solid var(--soca);
}
.stop.key::before{background:var(--panel);border-color:var(--panel)}
.t{font-family:var(--mono);font-size:12px;color:var(--panel);letter-spacing:.06em;display:block;margin-bottom:2px}
.stop p{margin:0;font-size:16px}
.stop small{display:block;color:var(--paper-dim);font-size:13.5px;margin-top:3px;line-height:1.45}

/* ---------- Tarjetas ---------- */
.card{
  background:var(--karst-2);border:1px solid var(--line);
  border-radius:14px;padding:16px;margin:0 0 12px;
}
.card h3{margin:0 0 10px;font-size:16px;letter-spacing:-.01em}
.label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--soca-dim);
}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{color:var(--paper-dim);font-size:14px;flex:0 0 auto}
.row .v{text-align:right;font-size:15px}
.mono{font-family:var(--mono);letter-spacing:.03em}
.fill{color:var(--panel-red);font-family:var(--mono);font-size:13px}

/* ---------- Lista de días ---------- */
.day{
  width:100%;text-align:left;display:flex;gap:14px;align-items:baseline;
  background:none;border:0;border-top:1px solid var(--line);
  padding:15px 2px;color:inherit;font:inherit;cursor:pointer;
}
.day:first-child{border-top:0}
.day .num{font-family:var(--mono);font-size:12.5px;color:var(--soca);flex:0 0 46px;letter-spacing:.04em}
.day .ttl{font-size:16px;font-weight:600;letter-spacing:-.01em}
.day .wd{display:block;font-size:12.5px;color:var(--paper-dim);font-weight:400;margin-top:2px}
.day.past{opacity:.42}
.day.today .num{color:var(--panel);font-weight:700}
.day.today .ttl::after{content:" ·  hoy";color:var(--panel);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- Botones ---------- */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{
  display:inline-block;padding:9px 14px;border-radius:999px;
  border:1px solid var(--soca-dim);color:var(--soca);
  font-size:13.5px;font-weight:600;background:none;cursor:pointer;
}
.btn.solid{background:var(--soca);color:var(--karst);border-color:var(--soca)}

/* ---------- Nav inferior ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--karst) 94%, transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  background:none;border:0;padding:11px 4px 12px;cursor:pointer;
  color:var(--paper-dim);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
}
nav button svg{display:block;margin:0 auto 5px;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--soca)}
.sec{margin:26px 0 10px}
.sec .label{display:block;margin-bottom:2px}
.sec h2{margin:0;font-size:19px;letter-spacing:-.02em}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
ul.plain li:first-child{border-top:0}
ul.plain li span{color:var(--paper-dim)}
.ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.op{flex:1 1 140px;text-align:left;padding:11px 13px;border-radius:12px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--paper);font:inherit}
.op b{display:block;font-size:14px;font-weight:600}
.op small{display:block;font-size:11.5px;color:var(--paper-dim);margin-top:2px;line-height:1.35}
.op.on{border-color:var(--soca);background:rgba(79,195,184,.11)}
.op.on b{color:var(--soca)}
.park{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;padding:10px 12px;
  background:rgba(217,162,51,.09);border:1px solid rgba(217,162,51,.3);border-radius:11px}
.park.free{background:rgba(79,195,184,.1);border-color:rgba(79,195,184,.35)}
.park .pk{flex:0 0 auto;width:20px;height:20px;border-radius:5px;background:var(--panel);color:var(--karst);
  font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.park.free .pk{background:var(--soca)}
.park b{display:block;font-size:13.5px;font-weight:600;color:var(--paper)}
.park small{display:block;color:var(--paper-dim);font-size:12.5px;line-height:1.45;margin-top:2px}
.ruta{background:var(--karst-2);border:1px solid var(--line);border-radius:14px;padding:15px;margin:0 0 20px}
.wz-par{display:inline-flex;align-items:stretch;border:1px solid var(--soca-dim);
  border-radius:999px;overflow:hidden;max-width:100%}
.wz-par .wz{border:0;border-radius:0;max-width:none}
.wz-par.cama-par{border-color:var(--panel)}
.wz-alt{display:inline-flex;align-items:center;padding:0 11px;flex:0 0 auto;
  border-left:1px solid var(--soca-dim);color:var(--paper-dim);text-decoration:none;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.wz-par.cama-par .wz-alt{border-left-color:var(--panel)}
.wz-lista{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wz{display:inline-flex;align-items:center;gap:8px;padding:9px 13px 9px 9px;border-radius:999px;
  border:1px solid var(--soca-dim);color:var(--paper);font-size:13.5px;font-weight:500;
  text-decoration:none;max-width:100%}
.wz b{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--soca);color:var(--karst);
  font-family:var(--mono);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.wz.cama{border-color:var(--panel);}
.wz.cama b{background:var(--panel)}
.foto{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#0A1F1D}
.pie{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--paper-dim);
  margin:8px 2px 20px;line-height:1.5}
.art{display:block;width:100%;height:120px;border-radius:14px;margin:2px 0 18px;background:#0A1F1D;border:1px solid var(--line)}
.zona{margin:24px 0 0}
.zona-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.zona h2{margin:0;font-size:19px;letter-spacing:-.02em}
.zona .cuenta{font-family:var(--mono);font-size:11px;color:var(--soca-dim)}
.zona .intro{font-size:13.5px;color:var(--paper-dim);margin:4px 0 12px;line-height:1.5}
.btn.app{border-color:var(--panel);color:var(--panel)}
.cercanas{margin:16px 0 4px;padding:14px;border-radius:12px;
  background:rgba(90,169,196,.08);border:1px solid var(--soca)}
.btn.wl{border-color:var(--soca);color:var(--soca)}
.btn.civ{border-color:#F70759;color:#F70759}
.lugar{border-top:1px solid var(--line)}
.lugar:first-of-type{border-top:0}
.lugar-cab{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:none;border:0;padding:14px 2px;color:inherit;font:inherit;cursor:pointer;text-align:left}
.lugar-cab .nom{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.lugar-cab .dia{display:block;font-family:var(--mono);font-size:11px;color:var(--panel);
  letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.lugar-cab .mas{flex:0 0 auto;color:var(--soca);font-size:19px;line-height:1;transition:transform .2s}
.lugar.abierto .mas{transform:rotate(45deg)}
.lugar-cuerpo{display:none;padding:0 2px 18px}
.lugar.abierto .lugar-cuerpo{display:block}
.lugar-cuerpo p{margin:0 0 12px;font-size:14.5px;line-height:1.55;color:var(--paper)}
.datos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dato{background:rgba(79,195,184,.09);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.dato b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--soca-dim);font-weight:400;margin-bottom:2px}
.dato span{font-size:13.5px}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--soca);cursor:pointer;
  font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.buscador{width:100%;padding:12px 15px;margin:4px 0 6px;border-radius:12px;
  border:1px solid var(--line);background:var(--karst-2);color:var(--paper);
  font-family:var(--sans);font-size:15px}
.buscador::placeholder{color:var(--paper-dim)}
.vacio{color:var(--paper-dim);font-size:14px;padding:18px 2px}
.tel{border-top:1px solid var(--line);padding:15px 0}
.tel:first-of-type{border-top:0;padding-top:4px}
.tel h4{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.tel .sub{margin:3px 0 0;font-size:13px;color:var(--paper-dim);line-height:1.45}
.tel .num{font-family:var(--mono);font-size:15px;color:var(--soca);margin:8px 0 0;letter-spacing:.04em}
.tel.sos h4{color:var(--panel-red)}
.tel.sos .num{color:var(--panel-red);font-size:22px;font-weight:700}
.btn.wa{border-color:#25D366;color:#25D366}
.btn.sos{background:var(--panel-red);border-color:var(--panel-red);color:#fff}
.version{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--paper-dim);opacity:.6;margin:30px 0 4px}
.note{font-size:13.5px;color:var(--paper-dim);line-height:1.5;margin:10px 0 0}

/* Marcado, notas, cercanía y modo claro */
.stop .tick{margin-left:9px;width:22px;height:22px;border-radius:50%;vertical-align:middle;
  border:1.5px solid var(--line);background:transparent;color:var(--soca);
  font-size:12px;line-height:1;cursor:pointer;padding:0}
.stop.hecho > p, .stop.hecho small{opacity:.45}
.stop.hecho > p{text-decoration:line-through;text-decoration-thickness:1px}
.stop.hecho::before{background:var(--soca);border-color:var(--soca)}
.diario{margin:4px 0 8px}
.nota-txt{width:100%;margin-top:6px;padding:11px 13px;border-radius:12px;resize:none;overflow:hidden;
  border:1px solid var(--line);background:var(--karst-2);color:var(--paper);
  font-family:var(--sans);font-size:14.5px;line-height:1.5}
.nota-txt::placeholder{color:var(--paper-dim)}
.btn.voz{border-color:var(--soca)}
.btn.grabando{background:var(--panel-red);border-color:var(--panel-red);color:#fff}
.km{float:right;font-family:var(--mono);font-size:12px;color:var(--paper-dim)}


.ilustrado{display:block;width:100%;height:auto;border-radius:14px;
  border:1px solid var(--line);margin:0 0 6px}
.mapa{background:var(--karst-2);border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;margin:6px 0 20px}
.mapa svg{display:block;width:100%;height:auto}
.mapa polyline{fill:none;stroke:var(--soca-dim);stroke-width:1.6;stroke-linejoin:round;
  stroke-linecap:round;stroke-dasharray:3 4;opacity:.85}
.mapa .par{fill:var(--soca-dim);opacity:.75}
.mapa .par.act{fill:var(--panel);opacity:1}
.mapa .cama circle{fill:var(--soca);stroke:var(--karst-2);stroke-width:2;cursor:pointer}
.mapa .cama.act circle{fill:var(--panel)}
.mapa .cama .cuenta{font-size:8px;font-weight:700;fill:var(--karst-2);text-anchor:middle}
.mapa .cama text{font-family:var(--mono);font-size:8.5px;fill:currentColor;opacity:.75;
  text-anchor:middle;pointer-events:none}
.mapa .cama.act text{opacity:1;font-weight:700}

/* ── Modo claro: se activa con la clase, o solo si el sistema está en claro ── */
body.claro{--karst:#F3F6F4;--karst-2:#FFFFFF;--paper:#0C231F;--paper-dim:#4A625D;
  --line:rgba(12,35,31,.15);--soca:#0C6A61;--soca-dim:#128077;
  --panel:#7D5A10;--panel-red:#A33827;}
@media (prefers-color-scheme: light){
  body.auto{--karst:#F3F6F4;--karst-2:#FFFFFF;--paper:#0C231F;--paper-dim:#4A625D;
  --line:rgba(12,35,31,.15);--soca:#0C6A61;--soca-dim:#128077;
  --panel:#7D5A10;--panel-red:#A33827;}
}

/* Selector de color, arriba a la derecha */
header{position:relative}
.tema-mini{position:absolute;top:calc(10px + env(safe-area-inset-top));right:17px;
  display:flex;gap:2px;padding:2px;border-radius:999px;z-index:2}
.tm{width:28px;height:28px;border-radius:50%;border:0;background:transparent;
  cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.42;
  color:currentColor;font-family:var(--sans)}
.tm.on{opacity:1;background:rgba(127,127,127,.18)}

.cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cat{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--paper);font-family:var(--sans);font-size:13px;cursor:pointer}
.cat.on{border-color:var(--soca);background:rgba(127,176,105,.13);color:var(--soca);font-weight:600}
.radios{display:flex;gap:6px;margin:0 0 12px}
.radio{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:transparent;
  color:var(--paper-dim);font-family:var(--mono);font-size:11.5px;cursor:pointer}
.radio.on{border-color:var(--panel);color:var(--panel)}
.serv-fila{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.serv-fila b{font-size:15px;font-weight:600}
.serv-fila small{display:block;font-size:12.5px;color:var(--paper-dim);margin-top:2px}

.cerca-aviso{display:flex;gap:11px;align-items:flex-start;margin:0 0 16px;padding:13px 14px;
  border-radius:13px;background:rgba(200,155,60,.14);border:1px solid rgba(200,155,60,.38)}
.cerca-aviso .ic{flex:0 0 auto;color:var(--panel);font-size:17px;line-height:1.2}
.cerca-aviso b{display:block;font-size:15px;color:var(--paper)}
.cerca-aviso small{display:block;font-size:13px;color:var(--paper-dim);margin-top:3px;line-height:1.45}

/* La barra y la cabecera siguen el color de fondo, sea cual sea el tema */
@supports not (background: color-mix(in srgb, red 50%, transparent)){
  nav{background:var(--karst)}
  header{background:var(--karst)}
}

.km i{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.6;color:var(--paper-dim)}

.tiempo{background:var(--karst-2);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin:0 0 16px}
.t-hoy{display:flex;align-items:center;gap:13px}
.t-hoy .ico{font-size:30px;line-height:1}
.t-hoy b{display:block;font-size:21px;letter-spacing:-.02em;color:var(--paper)}
.t-hoy small{display:block;font-size:13px;color:var(--paper-dim);margin-top:2px}
.t-man{display:flex;align-items:baseline;gap:9px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line);font-size:14px;color:var(--paper-dim)}
.t-man b{color:var(--paper);font-weight:600}
.t-man small{color:var(--soca)}
.tiempo .fuente{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--paper-dim);opacity:.65;margin:10px 0 0}

/* Fotos del día */
.fotos-dia{margin:18px 0 8px}
.galeria{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.miniatura{position:relative;width:calc(33.333% - 6px);aspect-ratio:1;
  border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.miniatura img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.miniatura .quitar{position:absolute;top:4px;right:4px;width:23px;height:23px;
  border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;
  font-size:15px;line-height:1;cursor:pointer;padding:0}
.btn.camara{cursor:pointer}
.visor-foto{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);
  display:grid;place-items:center;padding:16px}
.visor-foto img{max-width:100%;max-height:86vh;border-radius:10px}
.visor-foto .cerrar{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));
  padding:11px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.4);
  background:transparent;color:#fff;font-family:var(--sans);font-size:14.5px;cursor:pointer}

.mapa .modos{display:flex;gap:6px;margin:0 0 10px}
.mapa .modo{flex:1;padding:7px 10px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--paper-dim);font-family:var(--sans);font-size:12.5px;cursor:pointer}
.mapa .modo.on{border-color:var(--soca);color:var(--soca);font-weight:600;
  background:rgba(127,176,105,.1)}
.mapa polyline.tenue{opacity:.28}
.mapa polyline.real{stroke:var(--panel);stroke-width:2.4;stroke-dasharray:none;opacity:.95}
.mapa .pisada{fill:var(--panel)}

.foto-portada{display:block;width:100%;height:auto;border-radius:14px;
  border:1px solid var(--line);margin:2px 0 16px;cursor:pointer}
.miniatura .estrella{position:absolute;bottom:4px;right:4px;width:24px;height:24px;
  border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;
  font-size:13px;line-height:1;cursor:pointer;padding:0}
.miniatura.portada{outline:2px solid var(--panel);outline-offset:-2px}
.miniatura.portada .estrella{background:var(--panel);color:#000}
.aqui-zona{margin:18px 0 8px}
.aqui-zona .plain{list-style:none;margin:8px 0 0;padding:0}
.visita{padding:10px 0;border-top:1px solid var(--line)}
.visita:first-child{border-top:0}
.visita b{font-size:15px;color:var(--paper)}
.visita small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--paper-dim);margin-top:2px}
.btn.borrar-v{border-color:var(--panel-red);color:var(--panel-red)}

.busca-sitio{background:var(--karst-2);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-top:9px}
.busca-sitio input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--paper);font-family:var(--sans);font-size:14.5px}
.res-sitio{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-top:1px solid var(--line)}
.res-sitio:first-child{border-top:0}
.res-sitio b{font-size:14.5px;color:var(--paper)}
.res-sitio small{display:block;font-size:12px;color:var(--paper-dim);margin-top:1px}

.mapa-dia{background:var(--karst-2);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin:0 0 16px}
.mapa-dia svg{width:100%;height:auto;display:block}
.mapa-dia polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mapa-dia polyline.prev{stroke:var(--soca-dim);stroke-width:2;stroke-dasharray:4 5;opacity:.75}
.mapa-dia polyline.real{stroke:var(--panel);stroke-width:2.6}
.mapa-dia .pisada{fill:var(--panel)}
.mapa-dia .pp circle{fill:var(--soca)}
.mapa-dia .pp text{fill:var(--karst-2);font-family:var(--mono);font-size:8.5px;
  font-weight:700;text-anchor:middle}
.mapa-dia .cama-d circle{fill:none;stroke:var(--panel);stroke-width:2.4}
.mapa-dia .yo circle{fill:#4C9BE8}
.mapa-dia .yo .halo{fill:#4C9BE8;opacity:.22}
.mapa-dia .leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--paper-dim)}
.mapa-dia .leyenda span{display:inline-flex;align-items:center;gap:5px}
.mapa-dia .leyenda i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mapa-dia .c-prev{background:var(--soca)}
.mapa-dia .c-real{background:var(--panel)}
.mapa-dia .c-yo{background:#4C9BE8}

.mapa-cab{margin:0 0 18px}
.mapa-pes{display:flex;gap:6px;margin:0 0 9px}
.mp{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--paper-dim);font-family:var(--sans);font-size:13px;cursor:pointer}
.mp.on{border-color:var(--soca);color:var(--soca);font-weight:600;background:rgba(127,176,105,.1)}
.mapa-cab .mapa,.mapa-cab .mapa-dia{margin:0}

.vistazo{background:var(--karst-2);border-left:3px solid var(--panel);
  border-radius:0 12px 12px 0;padding:13px 15px;margin:0 0 16px}
.vistazo p{margin:0;font-size:15px;line-height:1.5;color:var(--paper)}
.vistazo p + p{margin-top:7px}
.vistazo .v-lluvia,.vistazo .v-hora{font-weight:600}
.vistazo .v-aviso::before{content:"· "}
.vistazo .v-nota,.vistazo .v-ayer{font-style:italic;color:var(--paper-dim)}
.vistazo .v-nota::before,.vistazo .v-ayer::before{content:"“";color:var(--soca);font-style:normal}
.vistazo .v-nota::after,.vistazo .v-ayer::after{content:"”";color:var(--soca);font-style:normal}
.vistazo .v-hecho{color:var(--soca)}

.cama-zona{margin:18px 0 8px}
.cama-ficha{background:var(--karst-2);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-top:8px}
.cama-cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cama-cab b{font-size:16px;color:var(--paper)}
.cama-cab small{display:block;font-size:12.5px;color:var(--paper-dim);margin-top:2px}
.cama-val{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px}
.cama-val.v3{background:rgba(127,176,105,.18);color:var(--soca)}
.cama-val.v2{background:rgba(200,155,60,.16);color:var(--panel)}
.cama-val.v1{background:rgba(178,84,58,.16);color:var(--panel-red)}
.cama-nota{margin:9px 0 0;font-size:14px;line-height:1.5;color:var(--paper-dim);font-style:italic}
.tipos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tipo{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--paper-dim);font-family:var(--sans);font-size:12.5px;cursor:pointer}
.tipo.on{border-color:var(--soca);color:var(--soca);background:rgba(127,176,105,.1)}
.tipo.val3.on{border-color:var(--soca);color:var(--soca)}
.tipo.val1.on{border-color:var(--panel-red);color:var(--panel-red);background:rgba(178,84,58,.1)}
</style>
</head>
<body>

<header>
  <div id="tema-zona"></div>
  <a class="volver" href="../">‹ Viajes</a>
  <p class="eyebrow" id="eyebrow">Eslovenia · Venecia</p>
  <h1 id="title">Cargando</h1>
  <p class="sub" id="subtitle"></p>
</header>

<main>
  <section class="view on" id="v-hoy"></section>
  <section class="view" id="v-dias"></section>
  <section class="view" id="v-reservas"></section>
  <section class="view" id="v-guia"></section>
  <section class="view" id="v-info"></section>
</main>

<nav>

/* ---- Modo de color, compartido por todas las apps ---- */
const TEMA = {
  get valor(){ try { return localStorage.getItem("tema_viajes") || "auto"; } catch { return "auto"; } },
  set valor(v){ try { localStorage.setItem("tema_viajes", v); } catch {}; this.aplica(); },
  pintaMini(){
    const z = document.getElementById("tema-zona");
    if (!z) return;
    z.innerHTML = this.mini();
    z.querySelectorAll("[data-tema]").forEach(b =>
      b.addEventListener("click", () => { TEMA.valor = b.dataset.tema; TEMA.pintaMini(); }));
  },
  aplica(){
    const v = this.valor;
    document.body.classList.toggle("claro", v === "claro");
    document.body.classList.toggle("auto",  v === "auto");
    const m = document.querySelector('meta[name="theme-color"]');
    if (!m) return;
    const oscuro = m.dataset.oscuro || m.getAttribute("content");
    if (!m.dataset.oscuro) m.dataset.oscuro = oscuro;
    const claroDeVerdad = v === "claro" ||
      (v === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
    m.setAttribute("content", claroDeVerdad ? "#F4F6F7" : m.dataset.oscuro);
  },
  mini(){
    const v = this.valor;
    const b = (id, t, etiqueta) =>
      `<button class="tm${v === id ? " on" : ""}" data-tema="${id}" aria-label="${etiqueta}" title="${etiqueta}">${t}</button>`;
    return `<div class="tema-mini">${b("auto","◐","Automático")}${b("claro","☀","Claro")}${b("oscuro","☾","Oscuro")}</div>`;
  },
  opciones(){
    const v = this.valor;
    const b = (id, t, sub) => `<button class="op${v === id ? " on" : ""}" data-tema="${id}"><b>${t}</b><small>${sub}</small></button>`;
    return `<div class="ops">${b("auto","Automático","Como el móvil")}${b("claro","Claro","Para el sol")}${b("oscuro","Oscuro","Para la noche")}</div>`;
  },
  engancha(volver){
  }
};
if (window.matchMedia)
  matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => TEMA.aplica());

const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mapsDe = q => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}&travelmode=driving`;
const wazeXY = (la, lo) => `waze://?ll=${la},${lo}&navigate=yes`;
const mapsXY = (la, lo) => `https://www.google.com/maps/dir/?api=1&destination=${la},${lo}&travelmode=driving`;
const navegarXY = (la, lo) => PREF.app === "waze" ? wazeXY(la, lo) : mapsXY(la, lo);
const wikiloc = q => `https://es.wikiloc.com/wikiloc/map.do?q=${encodeURIComponent(q)}`;
const mapaXY = (la, lo) => `https://www.google.com/maps/search/?api=1&query=${la},${lo}`;
const mapa = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const fecha = f => { const d = new Date(f+"T12:00:00"); return {d, wd:DIAS_SEM[d.getDay()], txt:`${d.getDate()} ${MESES[d.getMonth()]}`}; };

function hoyISO(){
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
function indiceHoy(){
  const h = hoyISO();
  const i = VIAJE.dias.findIndex(d => d.f === h);
  if (i >= 0) return i;
  if (h < VIAJE.dias[0].f) return 0;                       // aún no ha empezado
  return VIAJE.dias.length - 1;                            // ya ha terminado
}

function pintaParadas(dia, iDia, ctx = "hoy"){
  const clase = "river";
  return `<div class="${clase}">` + dia.paradas.map((p, k) => {
    const clave = `${iDia}:${k}`;
    const ok = DIARIO.esta(clave);
    return `
    <div class="stop${p.key ? " key" : ""}${ok ? " hecho" : ""}" data-marca="${clave}">
      ${p.h ? `<span class="t">${esc(p.h)}</span>` : ""}
      <p>${esc(p.txt)}<button class="tick" aria-label="Marcar">${ok ? "✓" : ""}</button></p>
      ${p.n ? `<small>${esc(p.n)}</small>` : ""}
      ${p.mapa ? `<small><a href="${navegar(p.park?.w || p.w || p.mapa)}" target="_blank" rel="noopener">Ir con ${comoNavego()} →</a>${PREF.app === "waze" ? ` <a href="${mapa(p.park?.w || p.w || p.mapa)}" target="_blank" rel="noopener" style="color:var(--papel-dim)">· Ver en el mapa</a>`.replace("--papel-dim", "--paper-dim") : ""}</small>` : ""}
      ${p.wl ? `<small><a href="${wikiloc(p.wl)}" target="_blank" rel="noopener">Buscar la ruta en Wikiloc →</a></small>` : ""}
      ${p.g ? `<small><button class="lnk" data-guia="${esc(p.g)}">Qué es y qué ver →</button></small>` : ""}
      ${p.park ? `<div class="park${p.park.gratis ? " free" : ""}">
        <span class="pk">P</span>
        <div><b>${esc(p.park.n)}</b><small>${esc(p.park.p)}</small></div>
      </div>` : ""}
    </div>`; }).join("") + `</div>` + cajaAqui(iDia, ctx) + cajaPernocta(iDia, ctx) + cajaNota(iDia) + cajaFotos(iDia, ctx);
}

function cajaNota(i){
  return `<div class="diario">
    <span class="label">Notas del día</span>
    <textarea class="nota-txt" data-dia="${i}" rows="2"
      placeholder="Dónde aparcamos, cuánto costó, qué tal se comió…">${esc(DIARIO.nota(i))}</textarea>
    <div class="btns">
      ${VOZ ? `<button class="btn voz" data-dictar="${i}">Dictar</button>` : ""}
      <button class="btn" id="btn-compartir">Compartir el diario</button>
    </div>
    ${VOZ ? "" : `<p class="note">Para dictar, usa el micrófono del teclado del móvil.</p>`}
  </div>`;
}

function activaDiario(){
  document.querySelectorAll("[data-marca] .tick").forEach(b => {
    if (b.dataset.listo) return; b.dataset.listo = "1";
    b.addEventListener("click", e => {
      e.stopPropagation();
      const box = b.closest("[data-marca]");
      DIARIO.marcar(box.dataset.marca);
      box.classList.toggle("hecho");
      b.textContent = box.classList.contains("hecho") ? "✓" : "";
    });
  });
  document.querySelectorAll("[data-dictar]").forEach(b => {
    if (b.dataset.listo) return; b.dataset.listo = "1";
    b.addEventListener("click", () => {
      const t = document.querySelector(`.nota-txt[data-dia="${b.dataset.dictar}"]`);
      if (t) escuchar(t, b);
    });
  });
  const comp = document.getElementById("btn-compartir");
  if (comp && !comp.dataset.listo){ comp.dataset.listo = "1"; comp.addEventListener("click", compartirDiario); }
  document.querySelectorAll(".nota-txt").forEach(t => {
    if (t.dataset.listo) return; t.dataset.listo = "1";
    const crece = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
    crece();
    t.addEventListener("input", () => { crece(); DIARIO.guardarNota(+t.dataset.dia, t.value); });
  });
}

  ["sinpeajes",   "Sin peajes",     "Autovía y nacional"],
  ["secundarias", "Por carreteras", "Evita autopista y peaje"]

/* Enlace de navegación a un destino, según lo que tenga elegido */
function navegar(q){
  if (PREF.app === "waze") return `waze://?q=${encodeURIComponent(q)}&navigate=yes`;
  const u = new URLSearchParams({ api:"1", destination:q, travelmode:"driving" });
  const ev = EVITAR[PREF.via];
  if (ev) u.set("avoid", ev);
  return `https://www.google.com/maps/dir/?${u}`;
}
const comoNavego = () => PREF.app === "waze" ? "Waze" : "Maps";


/* ---- Lo que vais anotando, guardado en este móvil ---- */
const DIARIO = {
  _leer(k, def){ try { return JSON.parse(localStorage.getItem("eslo_" + k)) ?? def; } catch { return def; } },
  _escribir(k, v){ try { localStorage.setItem("eslo_" + k, JSON.stringify(v)); } catch {} },
  get hechas(){ return this._leer("hechas", {}); },
  marcar(clave){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.marcar("eslovenia", clave, !this.esta(clave));
    const h = this.hechas; h[clave] = !h[clave]; if (!h[clave]) delete h[clave]; this._escribir("hechas", h);
  },
  esta(clave){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.estaHecha("eslovenia", clave);
    return !!this.hechas[clave];
  },
  nota(i){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.nota("eslovenia", i);
    return this._leer("notas", {})[i] || "";
  },
  guardarNota(i, t){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.anotar("eslovenia", i, t);
    const n = this._leer("notas", {}); t.trim() ? n[i] = t : delete n[i]; this._escribir("notas", n);
  },
};


/* ---- Dónde estamos ---- */
let MIPOS = null;
function pedirUbicacion(){
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal("sin gps");
    navigator.geolocation.getCurrentPosition(
      p => { MIPOS = [p.coords.latitude, p.coords.longitude]; ok(MIPOS); },
      e => mal(e.message), { enableHighAccuracy:false, timeout:9000, maximumAge:120000 });
  });
}
function distancia(a, b){
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b[0]-a[0]), dLon = r(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}

/* ---- El tiempo ---- */
const tiempoEn = q => `https://www.google.com/search?q=${encodeURIComponent("tiempo " + q)}`;


const TITULO_DIA = (d, i) => { const f = fecha(d.f); return `${f.wd} ${f.txt}`; };

/* ---- Dictado por voz, si el navegador lo permite ---- */
const VOZ = window.SpeechRecognition || window.webkitSpeechRecognition || null;

function escuchar(destino, boton){
  if (!VOZ) return;
  const r = new VOZ();
  r.lang = "es-ES"; r.continuous = true; r.interimResults = false;
  let previo = destino.value;
  boton.classList.add("grabando"); boton.textContent = "● Escuchando";
  r.onresult = e => {
    let t = "";
    for (let i = e.resultIndex; i < e.results.length; i++)
      if (e.results[i].isFinal) t += e.results[i][0].transcript;
    if (!t) return;
    destino.value = (previo ? previo.trimEnd() + " " : "") + t.trim();
    previo = destino.value;
    destino.dispatchEvent(new Event("input", {bubbles:true}));
  };
  const parar = () => { boton.classList.remove("grabando"); boton.textContent = "Dictar"; };
  r.onerror = parar; r.onend = parar;
  boton.onclick = () => { r.stop(); parar(); boton.onclick = null; activaDiario(); };
  r.start();
}

/* ---- Compartir el diario ---- */
function textoDiario(){
  const lineas = [`${VIAJE.nombre}`, ""];
  VIAJE.dias.forEach((d, i) => {
    const hechas = d.paradas.filter((p, k) => DIARIO.esta(`${i}:${k}`));
    const nota = DIARIO.nota(i);
    if (!hechas.length && !nota) return;
    lineas.push(`${TITULO_DIA(d, i)} — ${d.t}`);
    hechas.forEach(p => lineas.push(`  · ${p.txt}`));
    if (nota) lineas.push(`  "${nota}"`);
    lineas.push("");
  });
  return lineas.length > 2 ? lineas.join("\n") : "";
}

async function compartirDiario(){
  const t = textoDiario();
  if (!t) return alert("Todavía no hay nada marcado ni escrito.");
  try {
    if (navigator.share) await navigator.share({ title: VIAJE.nombre, text: t });
    else { await navigator.clipboard.writeText(t); alert("Copiado. Pégalo donde quieras."); }
  } catch {}
}


/* ---- Rutas del día ---- */

}

const etiqueta = (d, i) => String(new Date(d.f + "T12:00:00").getDate());

/* ---- Mapa de la ruta, dibujado con las coordenadas reales ---- */
let modoMapa = "plan";

function mapaRuta(){
  const reales = (typeof DIARIO_SYNC !== "undefined") ? DIARIO_SYNC.recorridoReal(VIAJE_ID) : [];
  const hayReal = reales.length >= 2;
  if (modoMapa === "real" && !hayReal) modoMapa = "plan";

  const puntos = [], camas = new Map();
  VIAJE.dias.forEach((d, i) => {
    d.paradas.forEach(p => {
      const c = p.xy || (p.g && LUGARES[p.g] && LUGARES[p.g].xy);
      if (c) puntos.push({ xy:c.split(",").map(Number), dia:i, tipo:"parada" });
    });
    if (d.xy){
      puntos.push({ xy:d.xy.split(",").map(Number), dia:i, tipo:"cama" });
      if (!camas.has(d.xy)) camas.set(d.xy, []);
      camas.get(d.xy).push(i);              // varios días pueden dormir en el mismo sitio
    }
  });
  if (puntos.length < 3) return "";

  const lats = puntos.map(p => p.xy[0]), lons = puntos.map(p => p.xy[1]);
  const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2;
  const k = Math.cos(lat0 * Math.PI / 180);
  const W = 400, H = 250, M = 30;
  const xs = lons.map(l => l * k), ys = lats;
  const [x0,x1,y0,y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const e = Math.min((W - 2*M) / ((x1-x0) || 1), (H - 2*M) / ((y1-y0) || 1));
  const cx = v => M + (v * k - x0) * e + ((W - 2*M) - (x1-x0)*e) / 2;
  const cy = v => H - M - (v - y0) * e - ((H - 2*M) - (y1-y0)*e) / 2;

  const hoy = indiceHoy();

  // Si hay recorrido real, se dibuja encima con las coordenadas de verdad
  const realXY = reales.map(r => r.xy.split(",").map(Number));
  const dentro = v => v[0] >= y0 && v[0] <= y1 && v[1]*k >= x0 && v[1]*k <= x1;
  const lineaReal = realXY.filter(dentro)
    .map(v => `${cx(v[1]).toFixed(1)},${cy(v[0]).toFixed(1)}`).join(" ");

  const linea = puntos.map(p => `${cx(p.xy[1]).toFixed(1)},${cy(p.xy[0]).toFixed(1)}`).join(" ");

  // Las paradas, detrás
  const pequenos = puntos.filter(p => p.tipo === "parada").map(p =>
    `<circle class="par${p.dia === hoy ? " act" : ""}" cx="${cx(p.xy[1]).toFixed(1)}"
      cy="${cy(p.xy[0]).toFixed(1)}" r="${p.dia === hoy ? 4 : 2.6}"/>`).join("");

  // Un solo círculo por alojamiento, con todos sus días en la etiqueta
  let arriba = true;
  const grandes = [...camas.entries()].map(([c, dias]) => {
    const [la, lo] = c.split(",").map(Number);
    const x = cx(lo).toFixed(1), y = cy(la);
    const act = dias.includes(hoy);
    const r = act ? 7.5 : 5.5;
    arriba = !arriba;
    const dy = arriba ? -(r + 6) : (r + 12);
    return `<g class="cama${act ? " act" : ""}" data-dia="${dias[0]}">
      <circle cx="${x}" cy="${y.toFixed(1)}" r="${r}"/>
      ${dias.length > 1 ? `<text class="cuenta" x="${x}" y="${(y + 2.6).toFixed(1)}">${dias.length}</text>` : ""}
      <text x="${x}" y="${(y + dy).toFixed(1)}">${esc(rotulo(dias))}</text>
    </g>`;
  }).join("");

  const esReal = modoMapa === "real" && hayReal;

  return `<div class="mapa">
    ${hayReal ? `<div class="modos">
      <button class="modo${esReal ? "" : " on"}" data-modo="plan">Lo planeado</button>
      <button class="modo${esReal ? " on" : ""}" data-modo="real">Por dónde fuimos</button>
    </div>` : ""}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de la ruta">
      <polyline class="${esReal ? "tenue" : ""}" points="${linea}"/>
      ${esReal && lineaReal ? `<polyline class="real" points="${lineaReal}"/>` : ""}
      ${esReal ? realXY.filter(dentro).map(v =>
          `<circle class="pisada" cx="${cx(v[1]).toFixed(1)}" cy="${cy(v[0]).toFixed(1)}" r="3"/>`).join("") : ""}
      ${esReal ? "" : pequenos}${grandes}
    </svg>
    <p class="note" style="margin:8px 2px 0">${esReal
      ? `${reales.length} puntos guardados al ir marcando paradas: por dónde pasasteis de verdad.`
      : "Lo previsto, unido en el orden del viaje. El número dentro de un punto son las noches. Toca para ir a ese día."}</p>
  </div>`;
}

/* Etiqueta de un alojamiento: agrupa los días consecutivos */
function rotulo(dias){
  const partes = [];
  let ini = dias[0], fin = dias[0];
  for (let j = 1; j <= dias.length; j++){
    if (dias[j] === fin + 1){ fin = dias[j]; continue; }
    partes.push(ini === fin ? etiqueta(VIAJE.dias[ini], ini)
      : `${etiqueta(VIAJE.dias[ini], ini)}–${etiqueta(VIAJE.dias[fin], fin)}`);
    ini = fin = dias[j];
  }
  return partes.join(" · ") + " jul";
}


/* ---- Aviso si tienes una parada al lado ---- */
function xyDeParada(p){
  if (p.xy) return p.xy;
  if (p.g && LUGARES[p.g] && LUGARES[p.g].xy) return LUGARES[p.g].xy;
  return null;
}

async function avisoCerca(i){
  const z = document.getElementById("aviso-cerca");
  if (!z) return;
  const conXY = (VIAJE.dias[i].paradas || []).map(p => ({ p, xy: xyDeParada(p) })).filter(x => x.xy);
  if (!conXY.length) return;
  try {
    const pos = MIPOS || await pedirUbicacion();
    let mejor = null;
    for (const { p, xy } of conXY){
      const km = distancia(pos, xy.split(",").map(Number));
      if (!mejor || km < mejor.km) mejor = { p, km };
    }
    if (!mejor || mejor.km > 5) return;
    const d = mejor.km < 1 ? Math.round(mejor.km * 1000) + " m" : mejor.km.toFixed(1) + " km";
    z.innerHTML = `<div class="cerca-aviso"><span class="ic">◎</span>
      <div><b>Tienes ${d} en línea recta hasta ${esc(mejor.p.c || mejor.p.txt)}</b>
      ${mejor.p.n ? `<small>${esc(mejor.p.n)}</small>` : ""}</div></div>`;
  } catch {}
}




/* ═══════════════════════════════════════════════════════════
   El primer vistazo.

   Lo que la app ya sabe, dicho junto y en dos frases, en vez
   de repartido en cuatro pestañas. Se lee en un semáforo.

   Reglas: nada de rellenar por rellenar. Si no hay nada que
   avisar, no aparece. Y lo urgente primero.
   ═══════════════════════════════════════════════════════════ */

function frasesDelDia(i){
  const d = VIAJE.dias[i];
  if (!d) return [];
  const f = [];
  const ahora = new Date();
  const hora = ahora.getHours();
  const esHoy = (typeof indiceHoy === "function") && indiceHoy() === i;

  /* ---- 1. Lo que hay que hacer con hora ---- */
  const conHora = (d.paradas || []).filter(p => /\d/.test(p.h || ""));
  if (esHoy && conHora.length){
    const primera = conHora[0];
    const m = (primera.h || "").match(/(\d{1,2})[:.]?(\d{2})?/);
    if (m){
      const h = +m[1];
      if (hora < h) f.push({ tipo:"hora", txt:`${primera.c || primera.txt}, a las ${primera.h}.` });
    }
  }

  /* ---- 2. Lo que hay que reservar o llevar (solo por la mañana) ---- */
  const avisos = [];
  for (const p of (d.paradas || [])){
    const t = ((p.n || "") + " " + (p.park?.p || "")).toLowerCase();
    if (/reserv|entrada con hora|se agotan|comprar antes/.test(t))
      avisos.push(`${p.c || p.txt}: hay que reservar`);
    if (/efectivo|no.{0,12}tarjeta|dat[áa]fono/.test(t))
      avisos.push("llevad efectivo");
    if (/se llena|llegar (antes|pronto)|antes de las/.test(t) && !avisos.includes("madrugar"))
      avisos.push("el aparcamiento se llena pronto");
  }
  // por la tarde ya no hace falta recordar lo de llevar efectivo
  if (!esHoy || hora < 13)
    [...new Set(avisos)].slice(0, 2).forEach(a => f.push({ tipo:"aviso", txt: a }));

  /* ---- 3. Lo imprescindible, si aún no está hecho ---- */
  if (esHoy && typeof DIARIO_SYNC !== "undefined"){
    const clave = (d.paradas || []).map((p, k) => ({ p, k })).filter(x => x.p.key);
    const pendientes = clave.filter(x => !DIARIO_SYNC.estaHecha(VIAJE_ID, `${i}:${x.k}`));
    if (pendientes.length && hora >= 15 && hora < 21)
      f.unshift({ tipo:"pendiente", txt: pendientes.length === 1
        ? `Queda ${pendientes[0].p.c || pendientes[0].p.txt}.`
        : `Quedan ${pendientes.length} cosas: ${pendientes.map(x => x.p.c || x.p.txt).slice(0,2).join(", ")}.` });
    if (clave.length && !pendientes.length && hora >= 13)
      f.unshift({ tipo:"hecho", txt:"Lo importante del día, hecho." });
  }

  /* ---- 4. Lo que apuntaste tú ---- */
  if (typeof DIARIO_SYNC !== "undefined"){
    const mia = (DIARIO_SYNC.nota(VIAJE_ID, i) || "").trim();
    if (mia && !esHoy){
      // al releer un día pasado, lo primero es lo que escribiste
      f.unshift({ tipo:"nota", txt: mia.length > 150 ? mia.slice(0, 147) + "…" : mia });
    }
    // y si ayer apuntaste algo, hoy se recuerda
    if (esHoy && i > 0){
      const ayer = (DIARIO_SYNC.nota(VIAJE_ID, i - 1) || "").trim();
      if (ayer && hora < 12)
        f.push({ tipo:"ayer", txt:`Ayer apuntaste: ${ayer.length > 110 ? ayer.slice(0, 107) + "…" : ayer}` });
    }
  }

  /* ---- 5. Cuánto se conduce ---- */
  if (d.km && esHoy && hora < 12) f.push({ tipo:"coche", txt:`${d.km} al volante.` });

  return f;
}

async function frasesTiempo(i){
  const d = VIAJE.dias[i];
  if (!d || !d.xy || typeof elTiempo !== "function") return [];
  const [la, lo] = d.xy.split(",").map(Number);
  const t = await elTiempo(la, lo);
  if (!t) return [];
  const hoy = t[0];
  const f = [];
  if (hoy.lluvia != null && hoy.lluvia >= 50)
    f.push({ tipo:"lluvia", txt:`${hoy.lluvia}% de lluvia${d.lluvia ? `. Plan B: ${d.lluvia}` : ""}` });
  else if (hoy.max >= 30) f.push({ tipo:"calor", txt:`${hoy.max}° de máxima. Agua encima.` });
  else if (hoy.min <= 4) f.push({ tipo:"frio", txt:`${hoy.min}° de mínima. Abrigo.` });
  return f;
}

function pintaVistazo(i, ctx = "hoy"){
  const z = document.getElementById(ctx === "det" ? "vistazo-det" : "vistazo");
  if (!z) return;
  const f = frasesDelDia(i);
  const dibuja = lista => {
    if (!lista.length){ z.innerHTML = ""; return; }
    z.innerHTML = `<div class="vistazo">${lista.slice(0, 3).map(x =>
      `<p class="v-${x.tipo}">${esc(x.txt)}</p>`).join("")}</div>`;
  };
  dibuja(f);
  // el tiempo llega después, y si trae algo urgente se pone primero
  const tarde = new Date().getHours() >= 18;
  frasesTiempo(i).then(tf => {
    if (tf.length) dibuja(tarde ? [...f, ...tf] : [...tf, ...f]);
  }).catch(()=>{});
}

/* ---- Vista HOY ---- */
function vistaHoy(){
  const i = indiceHoy();
  const dia = VIAJE.dias[i];
  const sig = VIAJE.dias[i+1];
  const f = fecha(dia.f);
  const empezado = hoyISO() >= VIAJE.dias[0].f;

  document.getElementById("eyebrow").textContent = empezado ? `${f.wd} · ${f.txt}` : "Cuenta atrás";
  document.getElementById("title").textContent = dia.t;
  document.getElementById("subtitle").textContent = `Duermes en ${dia.base}`;

  let h = `<div id="vistazo"></div><div id="mapa-cab-hoy-${i}">${mapaCabecera(i, "hoy")}</div><div id="aviso-cerca"></div><div id="portada-hoy"></div><div id="zona-tiempo"></div>` + cabecera(dia) + botonesRuta(i) + pintaParadas(dia, i, "hoy");
  if (sig){
    const fs = fecha(sig.f);
    h += `<div class="sec"><span class="label">Mañana · ${esc(fs.wd)}</span><h2>${esc(sig.t)}</h2></div>
          <p class="note">${sig.paradas.map(p => esc(p.txt)).join(" · ")}</p>`;
  }
  document.getElementById("v-hoy").innerHTML = h;
  activaEnlacesGuia(); activaDiario(); activaAtajoServicios();
  activaCamara(i, "hoy"); pintaGaleria(i, true, "hoy");
  activaAqui(i, "hoy"); activaBuscarSitio(i, "hoy"); pintaAqui(i, "hoy"); pintaPernocta(i, "hoy"); activaMapaCab(i, "hoy"); pintaPortada(i, "hoy");
  pintaVistazo(i);
  if (PREF.avisar) avisoCerca(i);
  if (dia.xy) pintaTiempo(dia.xy, dia.base || "");
}

/* ---- Vista DÍAS ---- */
function vistaDias(){
  const h = hoyISO();
  document.getElementById("v-dias").innerHTML =
    `<div class="sec"><span class="label">18 → 29 julio</span><h2>Los doce días</h2></div>` + mapaRuta() +
    `<img class="ilustrado" src="../img/eslovenia-ilustrado.jpg" alt="Mapa ilustrado de Eslovenia" loading="lazy">
     <p class="pie">Mapa ilustrado · decorativo, las posiciones no son exactas</p>` +
    VIAJE.dias.map((d,i) => {
      const f = fecha(d.f);
      const cls = d.f === h ? "today" : (d.f < h ? "past" : "");
      return `<button class="day ${cls}" data-i="${i}">
        <span class="num">${esc(f.txt)}</span>
        <span class="ttl">${esc(d.t)}<span class="wd">${esc(f.wd)} · ${esc(d.base)}</span></span>
      </button>`;
    }).join("") + `<div id="detalle"></div>`;

  document.querySelectorAll(".mapa .modo").forEach(b => b.addEventListener("click", () => {
    modoMapa = b.dataset.modo;
    vistaDias();
  }));
  document.querySelectorAll(".mapa .cama").forEach(g => g.addEventListener("click", () => {
    const b = document.querySelector(`.day[data-i="${g.dataset.dia}"]`);
    if (b) b.click();
  }));
  document.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => {

/* ---- Contraseña guardada solo en este dispositivo ---- */
const CLAVE = "eslovenia26_pw";
function pintaPassword(){
  const campo = document.getElementById("pw");
  const zona  = document.getElementById("pw-set");
  if (!campo || !zona) return;
  let guardada = "";
  try { guardada = localStorage.getItem(CLAVE) || ""; } catch {}

  if (!guardada){
    campo.innerHTML = '<span class="fill">sin guardar</span>';
    zona.innerHTML = `
      <div class="btns" style="margin-top:10px">
        <input type="password" id="pw-in" placeholder="Pega la contraseña"
          style="flex:1;min-width:150px;padding:9px 12px;border-radius:999px;border:1px solid var(--soca-dim);
                 background:transparent;color:var(--paper);font-family:var(--mono);font-size:13.5px">
        <button class="btn solid" id="pw-save">Guardar</button>
      </div>`;
    document.getElementById("pw-save").addEventListener("click", () => {
      const v = document.getElementById("pw-in").value.trim();
      if (!v) return;
      try { localStorage.setItem(CLAVE, v); } catch {}
      pintaPassword();
    });
    return;
  }

  campo.textContent = "••••••••••••";
  zona.innerHTML = `
    <div class="btns" style="margin-top:10px">
      <button class="btn" id="pw-toggle">Mostrar</button>
      <button class="btn" data-copy="${guardada.replace(/"/g,"&quot;")}">Copiar contraseña</button>
      <button class="btn" id="pw-del">Borrar</button>
    </div>`;

  document.getElementById("pw-toggle").addEventListener("click", e => {
    const oculta = campo.textContent === "••••••••••••";
    campo.textContent = oculta ? guardada : "••••••••••••";
    e.target.textContent = oculta ? "Ocultar" : "Mostrar";
  });
  document.getElementById("pw-del").addEventListener("click", () => {
    try { localStorage.removeItem(CLAVE); } catch {}
    pintaPassword();
  });
  activaCopiar();
}

/* ---- Copiar al portapapeles ---- */
function activaCopiar(){
  document.querySelectorAll("[data-copy]").forEach(b => {
    if (b.dataset.listo) return;
    b.dataset.listo = "1";
    b.addEventListener("click", async () => {
      const txt = b.dataset.copy, original = b.textContent;
      try {
        if (navigator.clipboard) await navigator.clipboard.writeText(txt);
        else throw new Error("sin API");
      } catch {
        const ta = document.createElement("textarea");
        ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch {}
        document.body.removeChild(ta);
      }
      b.textContent = "Copiado";
      setTimeout(() => { b.textContent = original; }, 1400);
    });
  });
}

/* ---- Vista GUÍA ---- */
let filtroGuia = "";

function vistaGuia(){
  const q = filtroGuia.trim().toLowerCase();
  const coincide = l => !q || (l.n + " " + l.t + " " + l.zona).toLowerCase().includes(q);

  let html = `<input class="buscador" id="q" type="search" placeholder="Buscar un sitio…" value="${esc(filtroGuia)}">` + bloqueCerca() + bloqueServicios();
  let total = 0;

  GUIA.forEach(z => {
    const ls = z.lugares.filter(coincide);
    if (!ls.length) return;
    total += ls.length;
    html += `<div class="zona">
      <div class="zona-cab"><h2>${esc(z.zona)}</h2><span class="cuenta">${ls.length}</span></div>
      <p class="intro">${esc(z.nota)}</p>` + ilustra(z.arte) +
      ls.map(l => ficha(l)).join("") + rutasCercanas(z) + `</div>`;
  });

  if (!total) html += `<p class="vacio">Nada con ese nombre. Prueba con otra palabra.</p>`;
  document.getElementById("v-guia").innerHTML = html;

  const inp = document.getElementById("q");
  inp.addEventListener("input", e => {
    filtroGuia = e.target.value;
    const pos = e.target.selectionStart;
    vistaGuia();
    const nuevo = document.getElementById("q");
    nuevo.focus(); nuevo.setSelectionRange(pos, pos);
  });
  activaFichas(); activaCerca(); activaServicios(); activaEnlacesGuia();
  ponTiempos();
}

let ordenCercania = false;


/* ---- Servicios cerca, con OpenStreetMap ---- */
const CATEGORIAS = [
  { id:"comer",  n:"Comer",         q:'node["amenity"="restaurant"];node["amenity"="cafe"]' },
  { id:"super",  n:"Supermercado",  q:'node["shop"="supermarket"];node["shop"="convenience"]' },
  { id:"fuel",   n:"Gasolinera",    q:'node["amenity"="fuel"]' },
  { id:"agua",   n:"Agua potable",  q:'node["amenity"="drinking_water"]' },
  { id:"farm",   n:"Farmacia",      q:'node["amenity"="pharmacy"]' },
  { id:"vista",  n:"Miradores",     q:'node["tourism"="viewpoint"]' }
];
let catActiva = null, radioKm = 5;

async function buscarServicios(cat, pos, km){
  // En radios grandes, cosas como las gasolineras salen a miles y el servidor
  // se atraganta. Se le pide el mínimo y se corta pronto.
  const partes = cat.q.split(";").map(t => `${t}(around:${km*1000},${pos[0]},${pos[1]});`).join("");
  const tope = km >= 50 ? 60 : 40;
  const espera = km >= 50 ? 50 : 25;
  const consulta = `[out:json][timeout:${espera}];(${partes});out center ${tope};`;
  const ctrl = new AbortController();
  const corte = setTimeout(() => ctrl.abort(), (espera + 8) * 1000);
  try {
    const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(consulta),
                          { signal: ctrl.signal });
    clearTimeout(corte);
    if (!r.ok) throw new Error(r.status === 429 ? "ocupado" : r.status === 504 ? "lento" : r.status);
    const d = await r.json();
    return (d.elements || []).map(e => {
      const la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon;
      if (la == null) return null;
      return { nombre: e.tags?.name || cat.n,
               detalle: e.tags?.["addr:street"] || e.tags?.operator || "",
               xy:[la, lo], km: distancia(pos, [la, lo]) };
    }).filter(Boolean).sort((a,b) => a.km - b.km).slice(0, 12);
  } catch (e){ clearTimeout(corte); throw e; }
}

function bloqueServicios(){
  if (!MIPOS) return `<div class="card" id="c-servicios">
    <h3>Servicios cerca</h3>
    <p class="note" style="margin-top:0">Dónde comer, supermercados, gasolineras, agua potable
      o farmacias alrededor de donde estéis.</p>
    <div class="btns"><button class="btn solid" id="btn-serv">Usar mi ubicación</button></div>
  </div>`;
  return `<div class="card" id="c-servicios">
    <h3>Servicios cerca</h3>
    <p class="note" style="margin-top:0">Gasolineras, tiendas y sitios para comer alrededor.</p>
    <div class="cats">${CATEGORIAS.map(c =>
      `<button class="cat${catActiva === c.id ? " on" : ""}" data-cat="${c.id}">${c.n}</button>`).join("")}</div>
    <div class="radios">${[5,10,25,50,100].map(k =>
      `<button class="radio${radioKm === k ? " on" : ""}" data-km="${k}">${k} km</button>`).join("")}</div>
    <div id="res-serv"></div>
  </div>`;
}

async function lanzarServicios(){
  const cont = document.getElementById("res-serv");
  const cat = CATEGORIAS.find(c => c.id === catActiva);
  if (!cont || !cat) return;
  cont.innerHTML = `<p class="note">Buscando ${cat.n.toLowerCase()} en ${radioKm} km…</p>`;
  try {
    const r = await buscarServicios(cat, MIPOS, radioKm);
    if (!r.length){ cont.innerHTML = `<p class="note">Nada en ${radioKm} km. Prueba a ampliar el radio.</p>`; return; }
    cont.innerHTML = `<ul class="plain">${r.map((x, i) => `
      <li><div class="serv-fila">
        <div><b>${esc(x.nombre)}</b>${x.detalle ? `<small>${esc(x.detalle)}</small>` : ""}</div>
        <span class="km" id="ks-${i}">${x.km < 1 ? Math.round(x.km*1000) + " m" : x.km.toFixed(1) + " km"}<i>recto</i></span>
      </div>
      <div class="btns" style="margin-top:6px">
        <a class="btn" href="${navegarXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ir</a>
        <a class="btn" href="${mapaXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ver</a>
      </div></li>`).join("")}</ul>
      <p class="note" id="nota-serv">Calculando el tiempo por carretera…</p>`;
    const t = await porCarretera(MIPOS, r.map(x => x.xy));
    const ns = document.getElementById("nota-serv");
    if (t){
      // con los tiempos reales hay que reordenar: el orden por línea recta no vale
      const conTiempo = r.map((x, i) => ({ ...x, t: t[i] }))
        .sort((a, b) => (a.t?.seg ?? Infinity) - (b.t?.seg ?? Infinity));
      const lista = cont.querySelector("ul.plain");
      if (lista) lista.innerHTML = conTiempo.map(x => `
        <li><div class="serv-fila">
          <div><b>${esc(x.nombre)}</b>${x.detalle ? `<small>${esc(x.detalle)}</small>` : ""}</div>
          <span class="km">${x.t
            ? `${formatoTiempo(x.t.seg)}<i>${x.t.km != null ? Math.round(x.t.km) + " km" : "en coche"}</i>`
            : `${x.km < 1 ? Math.round(x.km*1000) + " m" : x.km.toFixed(1) + " km"}<i>recto</i>`}</span>
        </div>
        <div class="btns" style="margin-top:6px">
          <a class="btn" href="${navegarXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ir</a>
          <a class="btn" href="${mapaXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ver</a>
        </div></li>`).join("");
      if (ns) ns.textContent = "Ordenado por tiempo en coche. Datos de OpenStreetMap, mantenidos por voluntarios.";
    } else if (ns){
      ns.innerHTML = "<b>Distancias en línea recta.</b> Datos de OpenStreetMap.";
    }
  } catch (e) {
    const motivo = String(e?.message || "");
    cont.innerHTML = `<p class="note">${
      motivo === "ocupado" ? "El servidor de mapas está saturado ahora mismo. Prueba en un minuto."
      : motivo === "lento" || /abort/i.test(motivo)
        ? `Demasiados resultados en ${radioKm} km y el servidor no da abasto. Prueba con un radio menor.`
      : "No se pudo consultar. ¿Hay cobertura?"}</p>`;
  }
}

function activaServicios(){
  const bs = document.getElementById("btn-serv");
  if (bs) bs.addEventListener("click", async () => {
    bs.textContent = "Localizando…";
    try { await pedirUbicacion(); vistaGuia(); ponTiempos(); }
    catch { bs.textContent = "No se pudo obtener la ubicación"; }

  document.querySelectorAll("[data-cat]").forEach(x => x.addEventListener("click", () => {
    catActiva = x.dataset.cat; vistaGuia(); lanzarServicios(); }));
  document.querySelectorAll("[data-km]").forEach(x => x.addEventListener("click", () => {
    radioKm = +x.dataset.km; vistaGuia(); if (catActiva) lanzarServicios(); }));
}

let CERCANOS = [];

async function ponTiempos(){
  if (!CERCANOS.length || !MIPOS) return;
  const r = await porCarretera(MIPOS, CERCANOS.map(x => x.l.xy.split(",").map(Number)));
  const nota = document.getElementById("nota-cerca");
  if (!r){
    if (nota) nota.innerHTML = `<b>Distancias en línea recta</b>, no por carretera: en montaña la diferencia es enorme. Con cobertura se calcula el tiempo real.`;
    return;
  }
  // con los tiempos reales, el orden por línea recta ya no vale
  const conTiempo = CERCANOS.map((c, i) => ({ ...c, t: r[i] }))
    .sort((a, b) => (a.t?.seg ?? Infinity) - (b.t?.seg ?? Infinity));
  const cont = document.querySelector("#c-cerca .plain");
  if (cont) cont.innerHTML = conTiempo.map(({ l, km, t }) =>
    `<li><button class="lnk" data-guia="${esc(l.id)}">${esc(l.n)}</button>
     <span class="km">${t
        ? `${formatoTiempo(t.seg)}<i>${t.km != null ? Math.round(t.km) + " km" : "en coche"}</i>`
        : `${km} km<i>recto</i>`}</span></li>`).join("");
  activaEnlacesGuia();
  if (nota) nota.textContent = "Ordenado por tiempo en coche, calculado con OpenStreetMap.";
}

function bloqueCerca(){
  if (!MIPOS) return `<div class="card" id="c-cerca">
      <h3>¿Qué tengo cerca?</h3>
      <p class="note" style="margin-top:0">Ordena la guía por distancia desde donde estéis ahora.</p>

    </div>`;

    .filter(l => l.xy)
    .map(l => ({ l, km: distancia(MIPOS, l.xy.split(",").map(Number)) }))

       <span class="km" id="km-${i}">${km} km<i>recto</i></span></li>`).join("")}</ul>
    <p class="note" id="nota-cerca">Calculando el tiempo real por carretera…</p>
    <div class="btns"><button class="btn" id="btn-cerca">Actualizar</button></div>

}

function activaCerca(){
  const b = document.getElementById("btn-cerca");

/* ---- Funcionamiento sin cobertura ---- */
if ("serviceWorker" in navigator){
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      reg.update();                                   // busca versión nueva en cada arranque
      // Si entra un service worker nuevo, recarga sola una vez para mostrarlo
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        sw && sw.addEventListener("statechange", () => {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            if (!sessionStorage.getItem("recargado")) {
              sessionStorage.setItem("recargado", "1");
              location.reload();
            }
          }
        });
      });
    } catch {}
  });
}
