<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101C22">
<title>Viaje</title>
<style>
:root{
  --f:#101C22; --f2:#1A2A32; --t:#E9F0F2; --td:#8FA5AD;
  --line:rgba(91,200,180,.18); --ac:#5BC8B4; --acd:#3E8C7E; --am:#D9A233; --rj:#C0503F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --ok-txt:#5BC8B4; --aviso-txt:#E0B25A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--f);color:var(--t);font-family:var(--sans);font-size:16px;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:3px solid var(--am);outline-offset:3px}

header{position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--f) 74%,transparent);
  padding:calc(14px + env(safe-area-inset-top)) 20px 16px}
.volver{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--td);padding:5px 11px 5px 8px;
  border:1px solid var(--line);border-radius:999px;margin-bottom:11px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--acd);margin:0 0 4px}
h1{font-size:26px;line-height:1.12;letter-spacing:-.025em;font-weight:800;margin:0}
.sub{color:var(--td);font-size:14px;margin:6px 0 0}

main{padding:0 20px 30px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}

.senda{position:relative;margin:8px 0 0;padding-left:28px}
.senda::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:3px;
  background:linear-gradient(180deg,var(--ac),var(--acd));border-radius:3px;opacity:.55}
.stop{position:relative;padding:0 0 24px}
.stop::before{content:"";position:absolute;left:-25px;top:7px;width:11px;height:11px;
  border-radius:50%;background:var(--f);border:3px solid var(--ac)}
.stop.hecho::before{background:var(--ac)}
.stop.hecho > p{color:var(--td);text-decoration:line-through;text-decoration-thickness:1px}
.t{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--am);letter-spacing:.06em;display:block;margin-bottom:3px}
.stop p{margin:0;font-size:16px}
.stop small{display:block;color:var(--td);font-size:14.5px;margin-top:5px;line-height:1.5}
.tick{position:relative;margin-left:10px;width:26px;height:26px;border-radius:50%;vertical-align:middle;
  border:1.5px solid var(--line);background:transparent;color:var(--ac);
  font-size:14px;line-height:1;cursor:pointer;padding:0}
.tick::after{content:"";position:absolute;inset:-9px;border-radius:50%}

.card{background:var(--f2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:16px}
.sec{margin:24px 0 10px}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acd)}
.sec .label{display:block;margin-bottom:2px}
.sec h2{margin:0;font-size:21px;letter-spacing:-.02em}
.note{font-size:14px;color:var(--td);line-height:1.55;margin:11px 0 0}

.day{width:100%;text-align:left;display:flex;gap:14px;align-items:baseline;background:none;
  border:0;border-top:1px solid var(--line);padding:15px 2px;color:inherit;font:inherit;cursor:pointer}
.day:first-of-type{border-top:0}
.day .num{font-family:var(--mono);font-size:12.5px;color:var(--ac);flex:0 0 54px}
.day .ttl{font-size:16px;font-weight:600}
.day .wd{display:block;font-size:12.5px;color:var(--td);font-weight:400;margin-top:2px}
.day.past{opacity:.42}
.day.today .num{color:var(--am);font-weight:700}

.ruta{background:var(--f2);border:1px solid var(--line);border-radius:14px;padding:17px;margin:6px 0 22px}
.wz-lista{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* La entrada al modo conducción, separada: es la que se busca con prisa */
.conducir{display:flex;margin:18px 0 24px;padding-top:18px;border-top:1px solid var(--line)}
.conducir .btn{flex:1;min-height:52px;font-size:16px}

.wz-par{display:inline-flex;align-items:stretch;border:1px solid var(--acd);
  border-radius:999px;overflow:hidden;max-width:100%}
.wz{display:inline-flex;align-items:center;gap:8px;padding:9px 13px 9px 9px;
  border:0;color:var(--t);font-size:14px;font-weight:500;min-height:44px}
.wz b{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--ac);color:var(--f);
  font-family:var(--mono);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.wz-par.cama-par{border-color:var(--am)}
.wz-par.cama-par .wz b{background:var(--am)}
.wz-alt{display:inline-flex;align-items:center;padding:0 11px;flex:0 0 auto;
  border-left:1px solid var(--acd);color:var(--td);font-family:var(--mono);
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  min-height:44px;justify-content:center;min-width:44px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:10px 16px;border-radius:999px;border:1px solid var(--acd);
  color:var(--ac);font-size:13.5px;font-weight:600;background:none;cursor:pointer;font-family:var(--sans)}
.btn.solid{background:var(--ac);color:var(--f);border-color:var(--ac)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.diario{margin:4px 0 8px}
.nota-txt{width:100%;margin-top:6px;padding:11px 13px;border-radius:12px;resize:none;overflow:hidden;
  border:1px solid var(--line);background:var(--f2);color:var(--t);
  font-family:var(--sans);font-size:14.5px;line-height:1.5}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--f) 94%, transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:11px 2px 12px;cursor:pointer;color:var(--td);
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
nav button svg{display:block;margin:0 auto 5px;width:21px;height:21px;stroke:currentColor;
  fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
.ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.op{flex:1 1 130px;text-align:left;padding:11px 13px;border-radius:12px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--t);font:inherit}
.op b{display:block;font-size:14px;font-weight:600}
.op small{display:block;font-size:11.5px;color:var(--td);margin-top:2px}
.op.on{border-color:var(--ac);background:rgba(91,200,180,.11)}
.op.on b{color:var(--ac)}
.vacio{color:var(--td);font-size:15px;padding:30px 0;text-align:center}
.foto-dia{display:block;width:100%;height:auto;border-radius:14px;
  border:1px solid var(--line);margin:6px 0 16px}
.mini-foto{width:42px;height:42px;object-fit:cover;border-radius:9px;flex:0 0 auto}
.day{align-items:center}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.cat{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--t);font-family:var(--sans);font-size:13.5px;cursor:pointer}
.cat.on{border-color:var(--ac);background:rgba(91,200,180,.12);color:var(--ac);font-weight:600}
.radios{display:flex;gap:7px;margin:0 0 14px}
.radio{flex:1;padding:7px;border-radius:9px;border:1px solid var(--line);background:transparent;
  color:var(--td);font-family:var(--mono);font-size:12px;cursor:pointer}
.radio.on{border-color:var(--am);color:var(--am)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:12px 0;border-top:1px solid var(--line)}
ul.plain li:first-child{border-top:0}
.lugar-fila{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.lugar-fila b{font-size:15px;font-weight:600}
.lugar-fila small{display:block;font-size:12.5px;color:var(--td);margin-top:2px}
.km{font-family:var(--mono);font-size:12px;color:var(--td);flex:0 0 auto}
.stop.key::before{background:var(--am);border-color:var(--am)}
.stop.key > p{font-weight:600}
.lluvia{display:flex;gap:10px;align-items:flex-start;margin:2px 0 14px;padding:11px 13px;
  border-radius:12px;background:rgba(90,169,196,.1);border:1px solid rgba(90,169,196,.3)}
.lluvia .ic{flex:0 0 auto;color:var(--ac);font-size:15px;line-height:1.4}
.lluvia p{margin:0;font-size:13.5px;line-height:1.5;color:var(--t)}
.lluvia b{color:var(--t)}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{color:var(--td);font-size:14px;flex:0 0 auto}
.row .v{text-align:right;font-size:15px}
.mono{font-family:var(--mono);letter-spacing:.04em}
.num-tel{font-family:var(--mono);font-size:16px;color:var(--ac);margin:0}
.cerca-aviso{display:flex;gap:11px;align-items:flex-start;margin:0 0 16px;padding:13px 14px;
  border-radius:13px;background:rgba(217,162,51,.13);border:1px solid rgba(217,162,51,.36)}
.cerca-aviso .ic{flex:0 0 auto;color:var(--am);font-size:17px;line-height:1.2}
.cerca-aviso b{display:block;font-size:15px}
.cerca-aviso small{display:block;font-size:13px;color:var(--td);margin-top:3px;line-height:1.45}

/* ── Modo claro: se activa con la clase, o solo si el sistema está en claro ── */
body.claro{--f:#F4F6F5;--f2:#FFFFFF;--t:#0D1F24;--td:#4C626A;
  --line:rgba(13,31,36,.15);--ac:#0F7A69;--acd:#14907C;--am:#8A6412;--rj:#A83E29;--ok-txt:#0F6B5C;--aviso-txt:#7A5510;}
@media (prefers-color-scheme: light){
  body.auto{--f:#F4F6F5;--f2:#FFFFFF;--t:#0D1F24;--td:#4C626A;
  --line:rgba(13,31,36,.15);--ac:#0F7A69;--acd:#14907C;--am:#8A6412;--rj:#A83E29;--ok-txt:#0F6B5C;--aviso-txt:#7A5510;}
}

/* Selector de color, arriba a la derecha */
header{position:relative}
.tema-mini{position:absolute;top:calc(10px + env(safe-area-inset-top));right:17px;
  display:flex;gap:2px;padding:2px;border-radius:999px;z-index:2}
.tm{width:28px;height:28px;border-radius:50%;border:0;background:transparent;
  cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.42;
  color:currentColor;font-family:var(--sans)}
.tm.on{opacity:1;background:rgba(127,127,127,.18)}

/* La barra y la cabecera siguen el color de fondo, sea cual sea el tema */
@supports not (background: color-mix(in srgb, red 50%, transparent)){
  nav{background:var(--f)}
  header{background:var(--f)}
}

.km i{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.6;color:var(--td)}

.tiempo{background:var(--f2);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin:0 0 16px}
.t-hoy{display:flex;align-items:center;gap:13px}
.t-hoy .ico{font-size:30px;line-height:1}
.t-hoy b{display:block;font-size:21px;letter-spacing:-.02em;color:var(--t)}
.t-hoy small{display:block;font-size:13px;color:var(--td);margin-top:2px}
.t-man{display:flex;align-items:baseline;gap:9px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line);font-size:14px;color:var(--td)}
.t-man b{color:var(--t);font-weight:600}
.t-man small{color:var(--ac)}
.tiempo .fuente{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--td);opacity:.65;margin:10px 0 0}

/* Fotos del día */
.fotos-dia{margin:18px 0 8px}
.galeria{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.miniatura{position:relative;width:calc(33.333% - 6px);aspect-ratio:1;
  border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.miniatura img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.miniatura .quitar{position:absolute;top:4px;right:4px;width:23px;height:23px;
  border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;
  font-size:15px;line-height:1;cursor:pointer;padding:0}
.btn.camara{cursor:pointer}
.visor-foto{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);
  display:grid;place-items:center;padding:16px}
.visor-foto img{max-width:100%;max-height:86vh;border-radius:10px}
.visor-foto .cerrar{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));
  padding:11px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.4);
  background:transparent;color:#fff;font-family:var(--sans);font-size:14.5px;cursor:pointer}

.foto-portada{display:block;width:100%;height:auto;border-radius:14px;
  border:1px solid var(--line);margin:2px 0 16px;cursor:pointer}
.miniatura .estrella{position:absolute;bottom:4px;right:4px;width:24px;height:24px;
  border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;
  font-size:13px;line-height:1;cursor:pointer;padding:0}
.miniatura.portada{outline:2px solid var(--am);outline-offset:-2px}
.miniatura.portada .estrella{background:var(--am);color:#000}
.aqui-zona{margin:18px 0 8px}
.aqui-zona .plain{list-style:none;margin:8px 0 0;padding:0}
.visita{padding:10px 0;border-top:1px solid var(--line)}
.visita:first-child{border-top:0}
.visita-nom{font-size:15px;font-weight:600;color:var(--ac);
  text-decoration:underline;text-underline-offset:3px;display:inline-block}
.visita b{font-size:15px;color:var(--t)}
.visita small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--td);margin-top:2px}
.btn.borrar-v{border-color:var(--rj);color:var(--rj)}

.normas{list-style:none;margin:0;padding:0}
.normas li{position:relative;padding:9px 0 9px 20px;border-top:1px solid var(--line);
  font-size:14.5px;line-height:1.5}
.normas li:first-child{border-top:0}
.normas li::before{content:"·";position:absolute;left:6px;top:9px;color:var(--am);font-weight:700}

.busca-sitio{background:var(--f2);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-top:9px}
.busca-sitio input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--t);font-family:var(--sans);font-size:14.5px}
.res-sitio{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-top:1px solid var(--line)}
.res-sitio:first-child{border-top:0}
.res-sitio b{font-size:14.5px;color:var(--t)}
.res-sitio small{display:block;font-size:12px;color:var(--td);margin-top:1px}

.mapa-dia{background:var(--f2);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin:0 0 16px}
.mapa-dia svg{width:100%;height:auto;display:block}
.mapa-dia polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mapa-dia polyline.prev{stroke:var(--acd);stroke-width:2;stroke-dasharray:4 5;opacity:.75}
.mapa-dia polyline.real{stroke:var(--am);stroke-width:2.6}
.mapa-dia .pisada{fill:var(--am)}
.mapa-dia .pp circle{fill:var(--ac)}
.mapa-dia .pp text{fill:var(--f2);font-family:var(--mono);font-size:8.5px;
  font-weight:700;text-anchor:middle}
.mapa-dia .cama-d circle{fill:none;stroke:var(--am);stroke-width:2.4}
.mapa-dia .yo circle{fill:#4C9BE8}
.mapa-dia .yo .halo{fill:#4C9BE8;opacity:.22}
.mapa-dia .leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--td)}
.mapa-dia .leyenda span{display:inline-flex;align-items:center;gap:5px}
.mapa-dia .leyenda i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mapa-dia .c-prev{background:var(--ac)}
.mapa-dia .c-real{background:var(--am)}
.mapa-dia .c-yo{background:#4C9BE8}

.mapa-cab{margin:0 0 18px}
.mapa-pes{display:flex;gap:6px;margin:0 0 9px}
.mp{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--td);font-family:var(--sans);font-size:13px;cursor:pointer}
.mp.on{border-color:var(--ac);color:var(--ac);font-weight:600;background:rgba(127,176,105,.1)}
.mapa-cab .mapa,.mapa-cab .mapa-dia{margin:0}

.vistazo{background:var(--f2);border-left:3px solid var(--am);
  border-radius:0 12px 12px 0;padding:13px 15px;margin:0 0 16px}
.vistazo p{margin:0;font-size:15px;line-height:1.5;color:var(--t)}
.vistazo p + p{margin-top:7px}
.vistazo .v-lluvia,.vistazo .v-hora{font-weight:600}
.vistazo .v-aviso::before{content:"· "}
.vistazo .v-nota,.vistazo .v-ayer{font-style:italic;color:var(--td)}
.vistazo .v-nota::before,.vistazo .v-ayer::before{content:"“";color:var(--ac);font-style:normal}
.vistazo .v-nota::after,.vistazo .v-ayer::after{content:"”";color:var(--ac);font-style:normal}
.vistazo .v-hecho{color:var(--ac)}

.cama-zona{margin:18px 0 8px}
.cama-ficha{background:var(--f2);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-top:8px}
.cama-cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cama-cab b{font-size:16px;color:var(--t)}
.cama-cab small{display:block;font-size:12.5px;color:var(--td);margin-top:2px}
.cama-val{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px}
.cama-val.v3{background:rgba(127,176,105,.18);color:var(--ac)}
.cama-val.v2{background:rgba(200,155,60,.16);color:var(--am)}
.cama-val.v1{background:rgba(178,84,58,.16);color:var(--rj)}
.cama-nota{margin:9px 0 0;font-size:14px;line-height:1.5;color:var(--td);font-style:italic}
.tipos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tipo{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--td);font-family:var(--sans);font-size:12.5px;cursor:pointer}
.tipo.on{border-color:var(--ac);color:var(--ac);background:rgba(127,176,105,.1)}
.tipo.val3.on{border-color:var(--ac);color:var(--ac)}
.tipo.val1.on{border-color:var(--rj);color:var(--rj);background:rgba(178,84,58,.1)}

.donde{display:flex;gap:6px;margin:10px 0}
.dnd{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--td);font-family:var(--sans);font-size:13px;cursor:pointer}
.dnd.on{border-color:var(--ac);color:var(--ac);font-weight:600;background:rgba(127,176,105,.1)}

.donde{display:flex;gap:6px;margin:10px 0}
.dnd{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--td);font-family:var(--sans);font-size:13px;cursor:pointer}
.dnd.on{border-color:var(--ac);color:var(--ac);font-weight:600;background:rgba(91,200,180,.1)}
.motivo{font-family:var(--mono);font-size:11px;opacity:.75;color:var(--td)}

.aviso-nueva{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:60;padding:13px;border-radius:14px;border:0;background:var(--ac);color:var(--f);
  font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.hotel-zona{margin:18px 0 8px}
.estado-linea{display:block;width:100%;text-align:left;background:none;border:0;
  padding:0;font:inherit;font-size:13px;color:var(--td);cursor:pointer}
.estado-linea .est-glifo{font-weight:700;margin-right:3px}
.estado-linea[data-nivel="bien"] .est-glifo{color:var(--ok-txt)}
.estado-linea[data-nivel="aviso"] .est-glifo,
.estado-linea[data-nivel="problema"] .est-glifo{color:var(--aviso-txt)}
.est-detalle{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.est-detalle .row{display:flex;justify-content:space-between;gap:12px;
  padding:4px 0;font-size:12.5px;align-items:baseline}
.est-detalle .k{color:var(--td);flex:0 0 auto}
.est-detalle .v{text-align:right}
.btn.parar{border-color:var(--aviso-txt);color:var(--aviso-txt)}

/* Modo conducción: se lee de un vistazo, con sol y con una mano.
   Los botones no bajan de 56px y el bloque de acciones no se va nunca
   fuera de la pantalla, aunque la nota de la parada sea larga. */
.conduce{position:fixed;inset:0;z-index:120;background:var(--f);color:var(--t);
  display:flex;flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}
.conduce:focus{outline:none}
.conduce .cd-texto{flex:1 1 auto;min-height:0;overflow-y:auto}
.conduce .cd-cab{margin:0;font-size:15px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--td)}
.conduce .cd-hora{margin:16px 0 0;font-size:29px;font-weight:700;color:var(--ac)}
.conduce h1{margin:8px 0 0;font-size:34px;line-height:1.18;font-weight:700}
.conduce .cd-nota{margin:16px 0 0;font-size:19px;line-height:1.45;color:var(--td)}
.conduce .cd-acciones{flex:0 0 auto;padding-top:14px}
.conduce .cd-btn{display:block;width:100%;box-sizing:border-box;margin:10px 0 0;
  min-height:56px;padding:15px 18px;border-radius:14px;
  border:1px solid var(--line);background:transparent;color:var(--t);
  font-family:var(--sans);font-size:20px;font-weight:600;line-height:1.25;
  text-align:center;text-decoration:none;cursor:pointer}
.conduce .cd-ir{min-height:72px;font-size:26px;font-weight:700;
  background:var(--ac);color:var(--f);border-color:var(--ac)}
.conduce .cd-sin{margin:10px 0 0;min-height:56px;display:flex;align-items:center;
  justify-content:center;text-align:center;font-size:19px;color:var(--td)}
</style>
</head>
<body>

<header>
  <div id="tema-zona"></div>
  <a class="volver" href="../">‹ Viajes</a>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title">Cargando</h1>
  <p class="sub" id="subtitle"></p>
</header>

<main>
  <section class="view on" id="v-hoy"></section>
  <section class="view" id="v-dias"></section>
  <section class="view" id="v-reservas"></section>
  <section class="view" id="v-cerca"></section>
  <section class="view" id="v-info"></section>
</main>

<nav>
  <button class="on" data-v="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>Hoy</button>
  <button data-v="dias"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Días</button>
  <button data-v="reservas"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 0 0 4 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-4 2 2 0 0 0 0-4z"/><path d="M14 6v12"/></svg>Reservas</button>
  <button data-v="cerca"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Cerca</button>
  <button data-v="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Info</button>
</nav>

<script src="../sync.js"></script>
<script src="../assets/app.js"></script>
<script>

/* ---- Modo de color, compartido por todas las apps ---- */
const TEMA = {
  get valor(){ try { return localStorage.getItem("tema_viajes") || "auto"; } catch { return "auto"; } },
  set valor(v){ try { localStorage.setItem("tema_viajes", v); } catch {}; this.aplica(); },
  pintaMini(){
    const z = document.getElementById("tema-zona");
    if (!z) return;
    z.innerHTML = this.mini();
    z.querySelectorAll("[data-tema]").forEach(b =>
      b.addEventListener("click", () => { TEMA.valor = b.dataset.tema; TEMA.pintaMini(); }));
  },
  aplica(){
    const v = this.valor;
    document.body.classList.toggle("claro", v === "claro");
    document.body.classList.toggle("auto",  v === "auto");
    const m = document.querySelector('meta[name="theme-color"]');
    if (!m) return;
    const oscuro = m.dataset.oscuro || m.getAttribute("content");
    if (!m.dataset.oscuro) m.dataset.oscuro = oscuro;
    const claroDeVerdad = v === "claro" ||
      (v === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
    m.setAttribute("content", claroDeVerdad ? "#F4F6F7" : m.dataset.oscuro);
  },
  mini(){
    const v = this.valor;
    const b = (id, t, etiqueta) =>
      `<button class="tm${v === id ? " on" : ""}" data-tema="${id}" aria-label="${etiqueta}" title="${etiqueta}">${t}</button>`;
    return `<div class="tema-mini">${b("auto","◐","Automático")}${b("claro","☀","Claro")}${b("oscuro","☾","Oscuro")}</div>`;
  },
  opciones(){
    const v = this.valor;
    const b = (id, t, sub) => `<button class="op${v === id ? " on" : ""}" data-tema="${id}"><b>${t}</b><small>${sub}</small></button>`;
    return `<div class="ops">${b("auto","Automático","Como el móvil")}${b("claro","Claro","Para el sol")}${b("oscuro","Oscuro","Para la noche")}</div>`;
  },
  engancha(volver){
  }
};
if (window.matchMedia)
  matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => TEMA.aplica());
const VIAJE_ID = new URLSearchParams(location.search).get("id") || "viaje";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DIAS_SEM = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ---- Cargar el viaje ---- */
/* Navegación. Fuera de arrancar() a propósito: el motor común las necesita,
   y dentro de la función no serían visibles desde fuera. */
const waze = q => `waze://?q=${encodeURIComponent(q)}&navigate=yes`;
const wazeXY = (la, lo) => `waze://?ll=${la},${lo}&navigate=yes`;
const mapsXY = (la, lo) => `https://www.google.com/maps/dir/?api=1&destination=${la},${lo}&travelmode=driving`;
const mapa = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const mapaXY = (la, lo) => `https://www.google.com/maps/search/?api=1&query=${la},${lo}`;
const mapsDe = q => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}&travelmode=driving`;
const tiempoEn = q => `https://www.google.com/search?q=${encodeURIComponent("tiempo " + q)}`;
// P se define dentro de arrancar(), así que se consulta al llamar, no antes
const comoApp = () => (typeof P !== "undefined" && P.app) || "waze";
const navegar = q => comoApp() === "waze" ? waze(q) : mapsDe(q);
const navegarXY = (la, lo) => comoApp() === "waze" ? wazeXY(la, lo) : mapsXY(la, lo);
const comoNavego = () => comoApp() === "waze" ? "Waze" : "Maps";

const ID = new URLSearchParams(location.search).get("id");
let VIAJE = null;
try { VIAJE = (JSON.parse(localStorage.getItem("viajes_propios")) || []).find(v => v.id === ID); } catch {}

TEMA.aplica();
TEMA.pintaMini();
if (!VIAJE){
  document.getElementById("title").textContent = "No encontrado";
  document.getElementById("subtitle").textContent = "Ese viaje no está guardado en este móvil.";
  document.getElementById("v-hoy").innerHTML =
    `<p class="vacio">Puede que lo hayas borrado, o que lo crearas en otro teléfono.</p>
     <div class="btns" style="justify-content:center"><a class="btn solid" href="../crear/">Crear un viaje</a></div>`;
  document.querySelector("nav").style.display = "none";
} else {
  arrancar();
}

function arrancar(){

const P = {
  _g(k, d){ try { return JSON.parse(localStorage.getItem(`vp_${ID}_${k}`)) ?? d; } catch { return d; } },
  _s(k, v){ try { localStorage.setItem(`vp_${ID}_${k}`, JSON.stringify(v)); } catch {} },
  marcar(c){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.marcar(ID, c, !this.esta(c));
    const h = this._g("hechas", {}); h[c] ? delete h[c] : h[c] = 1; this._s("hechas", h);
  },
  esta(c){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.estaHecha(ID, c);
    return !!this._g("hechas", {})[c];
  },
  nota(i){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.nota(ID, i);
    return this._g("notas", {})[i] || "";
  },
  guardarNota(i, t){
    if (typeof DIARIO_SYNC !== "undefined") return DIARIO_SYNC.anotar(ID, i, t);
    const n = this._g("notas", {}); t.trim() ? n[i] = t : delete n[i]; this._s("notas", n);
  },
  get app(){ try { return localStorage.getItem("gen_app") || "waze"; } catch { return "waze"; } },
  set app(v){ try { localStorage.setItem("gen_app", v); } catch {} },
  get avisar(){ try { return localStorage.getItem("gen_avisar") !== "no"; } catch { return false; } },
  set avisar(v){ try { localStorage.setItem("gen_avisar", v ? "si" : "no"); } catch {} },
};


function hoyISO(){ const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }
function fechaDe(i){
  if (!VIAJE.desde) return null;
  const d = new Date(VIAJE.desde + "T12:00:00"); d.setDate(d.getDate() + i);
  return { wd:DIAS_SEM[d.getDay()], txt:`${d.getDate()} ${MESES[d.getMonth()]}`,
           iso:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` };
}
function indiceHoy(){
  if (!VIAJE.desde) return 0;
  const h = hoyISO();
  for (let i = 0; i < VIAJE.dias.length; i++) if (fechaDe(i)?.iso === h) return i;
  return h < VIAJE.desde ? 0 : VIAJE.dias.length - 1;
}

function botonesRuta(i){
  const d = VIAJE.dias[i];
  const tramos = d.paradas.filter(p => (p.mapa || "").trim());
  if (!tramos.length && !(d.dest || "").trim()) return "";
  const chip = (destino, texto, n, cama) =>
    `<span class="wz-par${cama ? " cama-par" : ""}"><a class="wz" href="${navegar(destino)}" target="_blank" rel="noopener">
      <b>${n}</b>${esc(texto)}</a>${P.app === "waze"
        ? `<a class="wz-alt" href="${mapa(destino)}" target="_blank" rel="noopener" title="Ver dónde está">ver</a>` : ""}</span>`;
  return `<div class="ruta">
    <span class="label">Navegar con ${comoNavego()}${d.km ? " · " + esc(d.km) : ""}</span>
    <div class="wz-lista">
      ${tramos.map((p, k) => chip(p.mapa, p.txt || p.mapa, k+1, false)).join("")}
      ${(d.dest || "").trim() ? chip(d.dest, "Alojamiento", tramos.length+1, true) : ""}
    </div>
    ${(d.dest || "").trim() ? `<div class="btns">
      <a class="btn" href="${tiempoEn(d.dest)}" target="_blank" rel="noopener">El tiempo hoy</a></div>` : ""}
  </div>`;
}

function pintaParadas(d, i, ctx = "hoy"){
  const con = d.paradas.filter(p => (p.txt || "").trim());
  return (con.length ? `<div class="senda">` + con.map((p, k) => {
    const c = `${i}:${k}`, ok = P.esta(c);
    return `<div class="stop${p.key ? " key" : ""}${ok ? " hecho" : ""}" data-marca="${c}">
      ${(p.h||"").trim() ? `<span class="t">${esc(p.h)}</span>` : ""}
      <p>${esc(p.txt)}<button class="tick" aria-label="Marcar">${ok ? "✓" : ""}</button></p>
      ${(p.n||"").trim() ? `<small>${esc(p.n)}</small>` : ""}
      ${(p.mapa||"").trim() ? `<small><a href="${navegar(p.mapa)}" target="_blank" rel="noopener">Ir con ${comoNavego()} →</a></small>` : ""}
    </div>`; }).join("") + `</div>` : "")
    + (d.lluvia ? `<div class="lluvia"><span class="ic">☂</span><p><b>Si llueve:</b> ${esc(d.lluvia)}</p></div>` : "")
    + `<div class="diario"><span class="label">Notas del día</span>
       <textarea class="nota-txt" data-dia="${i}" rows="2"
         placeholder="Qué tal fue, dónde comisteis, cuánto costó…">${esc(P.nota(i))}</textarea></div>`
    + bloqueHotel(d) + cajaAqui(i, ctx) + cajaPernocta(i, ctx) + cajaFotos(i, ctx);
}

function activaDiario(){
  document.querySelectorAll("[data-marca] .tick").forEach(b => {
    if (b.dataset.l) return; b.dataset.l = 1;
    b.addEventListener("click", () => {
      const box = b.closest("[data-marca]");
      P.marcar(box.dataset.marca);
      box.classList.toggle("hecho");
      b.textContent = box.classList.contains("hecho") ? "✓" : "";
    });
  });
  document.querySelectorAll(".nota-txt").forEach(t => {
    if (t.dataset.l) return; t.dataset.l = 1;
    const crece = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
    crece();
    t.addEventListener("input", () => { crece(); P.guardarNota(+t.dataset.dia, t.value); });
  });
}

/* ---- Aviso al estar cerca de una parada ---- */
async function avisoCerca(i){
  const z = document.getElementById("aviso-cerca");
  if (!z) return;
  const d = VIAJE.dias[i];
  const conXY = (d.paradas || []).map((p, k) => ({ p, k })).filter(x => x.p.xy);
  if (!conXY.length) return;
  try {
    const pos = await pedirUbicacion();
    let mejor = null;
    for (const { p, k } of conXY){
      const km = distancia(pos, p.xy.split(",").map(Number));
      if (!mejor || km < mejor.km) mejor = { p, k, km };
    }
    if (!mejor || mejor.km > 5) return;
    const dist = mejor.km < 1 ? Math.round(mejor.km * 1000) + " m" : mejor.km.toFixed(1) + " km";
    z.innerHTML = `<div class="cerca-aviso">
      <span class="ic">◎</span>
      <div><b>Tienes ${dist} en línea recta hasta ${esc(mejor.p.txt)}</b>
      ${mejor.p.n ? `<small>${esc(mejor.p.n)}</small>` : ""}</div>
    </div>`;
  } catch {}
}



/* ═══════════════════════════════════════════════════════════
   El primer vistazo.

   Lo que la app ya sabe, dicho junto y en dos frases, en vez
   de repartido en cuatro pestañas. Se lee en un semáforo.

   Reglas: nada de rellenar por rellenar. Si no hay nada que
   avisar, no aparece. Y lo urgente primero.
   ═══════════════════════════════════════════════════════════ */

function frasesDelDia(i){
  const d = VIAJE.dias[i];
  if (!d) return [];
  const f = [];
  const ahora = new Date();
  const hora = ahora.getHours();
  const esHoy = (typeof indiceHoy === "function") && indiceHoy() === i;

  /* ---- 1. Lo que hay que hacer con hora ---- */
  const conHora = (d.paradas || []).filter(p => /\d/.test(p.h || ""));
  if (esHoy && conHora.length){
    const primera = conHora[0];
    const m = (primera.h || "").match(/(\d{1,2})[:.]?(\d{2})?/);
    if (m){
      const h = +m[1];
      if (hora < h) f.push({ tipo:"hora", txt:`${primera.c || primera.txt}, a las ${primera.h}.` });
    }
  }

  /* ---- 2. Lo que hay que reservar o llevar (solo por la mañana) ---- */
  const avisos = [];
  for (const p of (d.paradas || [])){
    const t = ((p.n || "") + " " + (p.park?.p || "")).toLowerCase();
    if (/reserv|entrada con hora|se agotan|comprar antes/.test(t))
      avisos.push(`${p.c || p.txt}: hay que reservar`);
    if (/efectivo|no.{0,12}tarjeta|dat[áa]fono/.test(t))
      avisos.push("llevad efectivo");
    if (/se llena|llegar (antes|pronto)|antes de las/.test(t) && !avisos.includes("madrugar"))
      avisos.push("el aparcamiento se llena pronto");
  }
  // por la tarde ya no hace falta recordar lo de llevar efectivo
  if (!esHoy || hora < 13)
    [...new Set(avisos)].slice(0, 2).forEach(a => f.push({ tipo:"aviso", txt: a }));

  /* ---- 3. Lo imprescindible, si aún no está hecho ---- */
  if (esHoy && typeof DIARIO_SYNC !== "undefined"){
    const clave = (d.paradas || []).map((p, k) => ({ p, k })).filter(x => x.p.key);
    const pendientes = clave.filter(x => !DIARIO_SYNC.estaHecha(VIAJE_ID, `${i}:${x.k}`));
    if (pendientes.length && hora >= 15 && hora < 21)
      f.unshift({ tipo:"pendiente", txt: pendientes.length === 1
        ? `Queda ${pendientes[0].p.c || pendientes[0].p.txt}.`
        : `Quedan ${pendientes.length} cosas: ${pendientes.map(x => x.p.c || x.p.txt).slice(0,2).join(", ")}.` });
    if (clave.length && !pendientes.length && hora >= 13)
      f.unshift({ tipo:"hecho", txt:"Lo importante del día, hecho." });
  }

  /* ---- 4. Lo que apuntaste tú ---- */
  if (typeof DIARIO_SYNC !== "undefined"){
    const mia = (DIARIO_SYNC.nota(VIAJE_ID, i) || "").trim();
    if (mia && !esHoy){
      // al releer un día pasado, lo primero es lo que escribiste
      f.unshift({ tipo:"nota", txt: mia.length > 150 ? mia.slice(0, 147) + "…" : mia });
    }
    // y si ayer apuntaste algo, hoy se recuerda
    if (esHoy && i > 0){
      const ayer = (DIARIO_SYNC.nota(VIAJE_ID, i - 1) || "").trim();
      if (ayer && hora < 12)
        f.push({ tipo:"ayer", txt:`Ayer apuntaste: ${ayer.length > 110 ? ayer.slice(0, 107) + "…" : ayer}` });
    }
  }

  /* ---- 5. Cuánto se conduce ---- */
  if (d.km && esHoy && hora < 12) f.push({ tipo:"coche", txt:`${d.km} al volante.` });

  return f;
}

async function frasesTiempo(i){
  const d = VIAJE.dias[i];
  if (!d || !d.xy || typeof elTiempo !== "function") return [];
  const [la, lo] = d.xy.split(",").map(Number);
  const t = await elTiempo(la, lo);
  if (!t) return [];
  const hoy = t[0];
  const f = [];
  if (hoy.lluvia != null && hoy.lluvia >= 50)
    f.push({ tipo:"lluvia", txt:`${hoy.lluvia}% de lluvia${d.lluvia ? `. Plan B: ${d.lluvia}` : ""}` });
  else if (hoy.max >= 30) f.push({ tipo:"calor", txt:`${hoy.max}° de máxima. Agua encima.` });
  else if (hoy.min <= 4) f.push({ tipo:"frio", txt:`${hoy.min}° de mínima. Abrigo.` });
  return f;
}

function pintaVistazo(i, ctx = "hoy"){
  const z = document.getElementById(ctx === "det" ? "vistazo-det" : "vistazo");
  if (!z) return;
  const f = frasesDelDia(i);
  const dibuja = lista => {
    if (!lista.length){ z.innerHTML = ""; return; }
    z.innerHTML = `<div class="vistazo">${lista.slice(0, 3).map(x =>
      `<p class="v-${x.tipo}">${esc(x.txt)}</p>`).join("")}</div>`;
  };
  dibuja(f);
  // el tiempo llega después, y si trae algo urgente se pone primero
  const tarde = new Date().getHours() >= 18;
  frasesTiempo(i).then(tf => {
    if (tf.length) dibuja(tarde ? [...f, ...tf] : [...tf, ...f]);
  }).catch(()=>{});
}

/* ---- Vista HOY ---- */
function vistaHoy(){
  if (!VIAJE.dias.length){
    document.getElementById("eyebrow").textContent = VIAJE.nombre;
    document.getElementById("title").textContent = "Sin días todavía";
    document.getElementById("subtitle").textContent = "";
    document.getElementById("v-hoy").innerHTML =
      `<p class="vacio">Este viaje aún no tiene días.</p>
       <div class="btns" style="justify-content:center">
         <a class="btn solid" href="../crear/?id=${esc(ID)}">Añadir días</a></div>`;
    return;
  }
  const i = indiceHoy(), d = VIAJE.dias[i], f = fechaDe(i);
  document.getElementById("eyebrow").textContent = f ? `${f.wd} · ${f.txt}` : `Día ${i+1} de ${VIAJE.dias.length}`;
  document.getElementById("title").textContent = d.t || `Día ${i+1}`;
  document.getElementById("subtitle").textContent = (d.dest||"").trim() ? `Duermes en ${d.dest}` : VIAJE.nombre;

  let h = `<div id="vistazo"></div><div id="mapa-cab-hoy-${i}">${mapaCabecera(i, "hoy")}</div><div id="aviso-cerca"></div><div id="portada-hoy"></div><div id="zona-tiempo"></div>`
        + (d.foto ? `<img class="foto-dia" src="${d.foto}" alt="">` : "")
        + botonesRuta(i) + botonModoConduccion()

/* ---- Qué hay cerca, con OpenStreetMap ---- */
const CATEGORIAS = [
  { id:"agua",   n:"Agua potable",  q:'node["amenity"="drinking_water"]' },
  { id:"camper", n:"Autocaravanas", q:'node["tourism"="caravan_site"];way["tourism"="caravan_site"]' },
  { id:"fuel",   n:"Gasolinera",    q:'node["amenity"="fuel"]' },
  { id:"super",  n:"Supermercado",  q:'node["shop"="supermarket"]' },
  { id:"vista",  n:"Miradores",     q:'node["tourism"="viewpoint"]' },
  { id:"comer",  n:"Comer",         q:'node["amenity"="restaurant"];node["amenity"="cafe"]' }
];

function guardaPosicion(par){ miPos = par.join(","); }
let miPos = null, catActiva = null, radioKm = 5;
/* Se usaba en ocho sitios de la vista «Qué hay cerca» y no se declaraba en
   ninguno: al pulsar «Usar mi ubicación» saltaba un ReferenceError que el
   try/catch se tragaba, y los chips de categoría no llegaban a aparecer.
   La pestaña entera no funcionaba. */
let modoBusca = "cerca";

function distancia(a, b){
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b[0]-a[0]), dLon = r(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function pedirUbicacion(){
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal("Este móvil no da la ubicación");
    navigator.geolocation.getCurrentPosition(
      p => ok([p.coords.latitude, p.coords.longitude]),
      () => mal("No se pudo obtener la ubicación"),
      { enableHighAccuracy:false, timeout:12000, maximumAge:60000 });
  });
}

async function buscarCerca(cat, pos, km, op, alProbar){
  // En radios grandes, cosas como las gasolineras salen a miles y el servidor
  // se atraganta. Se le pide el mínimo y se corta pronto.
  //
  // Aquí solo hay un servidor, a diferencia de las apps a medida. Aun así
  // pasa por el mismo motor de presupuesto y cancelación: el plazo desde el
  // toque es el mismo, y también se puede parar. Darle los tres servidores
  // sería otra mejora, y cambia proveedores: queda para su momento.
  const partes = cat.q.split(";").map(t => `${t}(around:${km*1000},${pos[0]},${pos[1]});`).join("");
  const tope = km >= 50 ? 60 : 40;
  const espera = km >= 50 ? 50 : 25;
  const intentos = [ { tope, espera, ms: (espera + 8) * 1000 } ];

  return conPresupuesto(op, intentos, async (n, senal) => {
    const consulta = `[out:json][timeout:${espera}];(${partes});out center ${tope};`;
    const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(consulta),
                          { signal: senal });
    if (!r.ok)
      return { motivo: r.status === 429 ? "ocupado" : r.status === 504 ? "lento" : String(r.status) };
    const d = await r.json();
    const sitios = (d.elements || []).map(e => {
      const la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon;
      if (la == null) return null;
      return { nombre: e.tags?.name || cat.n,
               detalle: e.tags?.["addr:street"] || e.tags?.operator || e.tags?.description || "",
               xy:[la, lo], km: distancia(pos, [la, lo]) };
    }).filter(Boolean).sort((a,b) => a.km - b.km).slice(0, 12);
    return sitios.length ? { listo:true, valor:sitios } : { vacia:true };
  }, { alProbar });
}

function hayReservas(){

         Object.values(c).some(x => (x||"").trim());
}

      ${fila("Devolución", c.devolucion)}
      <div class="btns">
        ${c.telefono ? `<a class="btn solid" href="tel:${limpio(c.telefono)}">Llamar · ${esc(c.telefono)}</a>` : ""}
        ${c.reserva ? `<button class="btn" data-copy="${esc(c.reserva)}">Copiar reserva</button>` : ""}

function vistaCerca(){
  const z = document.getElementById("v-cerca");
  z.innerHTML = `
    <div class="sec"><span class="label">OpenStreetMap</span><h2>Qué hay cerca</h2></div>
    ${!miPos ? `<div class="card">
        <p class="note" style="margin-top:0">Busca servicios alrededor de donde estéis ahora.</p>
        <div class="btns"><button class="btn solid" id="dar-pos">Usar mi ubicación</button></div>
      </div>` : `
      <div class="cats">${CATEGORIAS.map(c =>
        `<button class="cat${catActiva === c.id ? " on" : ""}" data-cat="${c.id}">${c.n}</button>`).join("")}</div>
      <div class="donde">
        <button class="dnd${modoBusca === "cerca" ? " on" : ""}" data-donde="cerca">Cerca de aquí</button>
        <button class="dnd${modoBusca === "ruta" ? " on" : ""}" data-donde="ruta">De camino hoy</button>

      z.querySelector(".card").insertAdjacentHTML("beforeend", `<p class="note">${esc(e)}</p>`); }

  z.querySelectorAll("[data-cat]").forEach(x => x.addEventListener("click", () => {
    catActiva = x.dataset.cat; vistaCerca(); lanzarCerca();
  }));
  activaQueVer();
  z.querySelectorAll("[data-donde]").forEach(x => x.addEventListener("click", () => {
    modoBusca = x.dataset.donde; vistaCerca(); if (catActiva) lanzarCerca();
  }));
  z.querySelectorAll("[data-km]").forEach(x => x.addEventListener("click", () => {
    radioKm = +x.dataset.km; vistaCerca(); if (catActiva) lanzarCerca();
  }));
}

async function lanzarCerca(presupuesto){
  const cont = document.getElementById("res-cerca");
  const cat = CATEGORIAS.find(c => c.id === catActiva);
  if (!cont || !cat) return;
  const op = abreBusqueda(presupuesto);
  pintaBuscando(cont, `Buscando ${cat.n.toLowerCase()} en ${radioKm} km…`);
  try {
    const res = await buscarCerca(cat, miPos, radioKm, op,
      n => progresoBusqueda(`Buscando ${cat.n.toLowerCase()} en ${radioKm} km…`));
    if (res.estado === "reemplazada") return;
    if (res.estado !== "bien"){ pintaFinBusqueda(cont, op, res, { km:radioKm, modo:modoBusca }); return; }
    const r = res.valor;
    cont.innerHTML = `<ul class="plain">${r.map((x, i) => `
      <li>
        <div class="lugar-fila">
          <div><b>${esc(x.nombre)}</b>${x.detalle ? `<small>${esc(x.detalle)}</small>` : ""}</div>
          <span class="km" id="ks-${i}">${x.km < 1 ? Math.round(x.km*1000) + " m" : x.km.toFixed(1) + " km"}<i>recto</i></span>
        </div>
        <div class="btns" style="margin-top:6px">
          <a class="btn" href="${navegarXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ir</a>
        <a class="btn" href="${mapaXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ver</a>
          <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${x.xy.join(",")}"
             target="_blank" rel="noopener">Ver</a>
        </div>
      </li>`).join("")}</ul>
      <p class="note" id="nota-serv">Calculando el tiempo por carretera…</p>`;
    const t = await porCarreteraDeBusqueda(op, miPos, r.map(x => x.xy));
    const ns = document.getElementById("nota-serv");
    if (t){
      // con los tiempos reales hay que reordenar: el orden por línea recta no vale
      const conTiempo = r.map((x, i) => ({ ...x, t: t[i] }))
        .sort((a, b) => (a.t?.seg ?? Infinity) - (b.t?.seg ?? Infinity));
      const lista = cont.querySelector("ul.plain");
      if (lista) lista.innerHTML = conTiempo.map(x => `
        <li><div class="serv-fila">
          <div><b>${esc(x.nombre)}</b>${x.detalle ? `<small>${esc(x.detalle)}</small>` : ""}</div>
          <span class="km">${x.t
            ? `${formatoTiempo(x.t.seg)}<i>${x.t.km != null ? Math.round(x.t.km) + " km" : "en coche"}</i>`
            : x.desvio != null
              ? `${x.desvio < 1 ? Math.round(x.desvio*1000) + " m" : x.desvio.toFixed(1) + " km"}<i>de desvío</i>`
              : `${x.km < 1 ? Math.round(x.km*1000) + " m" : x.km.toFixed(1) + " km"}<i>recto</i>`}</span>
        </div>
        <div class="btns" style="margin-top:6px">
          <a class="btn" href="${navegarXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ir</a>
          <a class="btn" href="${mapaXY(x.xy[0], x.xy[1])}" target="_blank" rel="noopener">Ver</a>
        </div></li>`).join("");
      if (ns) ns.textContent = modoBusca === "ruta"
        ? "Por delante de ti, ordenado por lo pronto que lo pillas. Datos de OpenStreetMap."
        : "Ordenado por tiempo en coche. Datos de OpenStreetMap, mantenidos por voluntarios.";
    } else if (ns){
      ns.innerHTML = modoBusca === "ruta"
        ? "<b>Por delante de ti</b>, en línea recta: no se pudo calcular el tiempo en coche. Datos de OpenStreetMap."
        : "<b>Distancias en línea recta.</b> Datos de OpenStreetMap.";
    }
  } catch (e) {
    if (op.viva())
      pintaFinBusqueda(cont, op, { estado:"fallaron", motivo:String((e && e.message) || e) },
                       { km:radioKm, modo:modoBusca });
  } finally {
    cierraBusqueda(op);
  }
}

if ("serviceWorker" in navigator){
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      reg.update();

      // Recargar no basta: el service worker viejo sigue mandando hasta que se
      // cierran todas las pestañas. Hay que pedirle al nuevo que tome el mando.
      const vigila = sw => sw && sw.addEventListener("statechange", () => {
        if (sw.state === "installed" && navigator.serviceWorker.controller) avisaNueva(reg);
      });
      if (reg.waiting) avisaNueva(reg);
      vigila(reg.installing);
      reg.addEventListener("updatefound", () => vigila(reg.installing));

      let yaRecargado = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (yaRecargado) return;
        yaRecargado = true;
        location.reload();
      });
    } catch {}
  });

  function avisaNueva(reg){
    if (document.getElementById("hay-nueva")) return;
    const b = document.createElement("button");
    b.id = "hay-nueva";
    b.className = "aviso-nueva";
    b.textContent = "Versión nueva · tocar para usarla";
    b.addEventListener("click", () => {
      b.textContent = "Actualizando…";
      reg.waiting?.postMessage({ tipo: "aplicar" });
      setTimeout(() => location.reload(), 900);
    });
    document.body.appendChild(b);
  }
}
