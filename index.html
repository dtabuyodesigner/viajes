<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viajes">
<meta name="theme-color" content="#12181C">
<title>Viajes</title>
<style>
:root{
  --fondo:#12181C; --fondo-2:#1C252A; --tinta:#EDF1F3; --tinta-dim:#93A3AA;
  --linea:rgba(237,241,243,.12);
  --soca:#4FC3B8;   /* Eslovenia */
  --prau:#7FB069;   /* Asturias */
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
header{padding:calc(34px + env(safe-area-inset-top)) 22px 10px;max-width:640px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--tinta-dim);margin:0 0 6px}
h1{font-size:34px;line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:0}
main{padding:14px 22px calc(40px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

.viaje{display:block;position:relative;overflow:hidden;text-decoration:none;color:inherit;
  background:var(--fondo-2);border:1px solid var(--linea);border-radius:18px;
  padding:0;margin:0 0 14px}
.viaje .art{display:block;width:100%;height:150px;object-fit:cover;background:#0E2A28}
.viaje .cuerpo{padding:15px 17px 17px}
.viaje h2{margin:0;font-size:21px;letter-spacing:-.02em}
.viaje .fechas{font-family:var(--mono);font-size:12px;letter-spacing:.05em;
  color:var(--tinta-dim);margin:5px 0 0}
.viaje .estado{display:inline-flex;align-items:center;gap:7px;margin-top:11px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.punto{width:7px;height:7px;border-radius:50%;background:currentColor}
.viaje.curso .estado{color:var(--acento)}
.viaje.futuro .estado,.viaje.hecho .estado{color:var(--tinta-dim)}
.viaje.hecho{opacity:.62}
.viaje .flecha{position:absolute;right:17px;bottom:17px;font-size:20px;color:var(--acento)}
.nota{font-size:13px;color:var(--tinta-dim);line-height:1.55;margin:22px 2px 0}
.mantenimiento{margin:26px 0 0;padding:16px;border:1px solid var(--linea);border-radius:16px;
  background:var(--fondo-2)}
.ver{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tinta-dim);margin:0 0 11px}
.btn-act{width:100%;padding:12px;border-radius:999px;border:0;background:var(--tinta);color:var(--fondo);
  font-family:var(--sans);font-size:14.5px;font-weight:700;cursor:pointer}
.btn-act.ligero{background:transparent;color:var(--tinta);border:1px solid var(--linea);
  font-weight:600;margin-top:8px}
.mantenimiento .nota{margin:0}
.ops{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.op{flex:1 1 92px;text-align:left;padding:10px 11px;border-radius:11px;cursor:pointer;
  background:transparent;border:1px solid var(--linea);color:var(--tinta);font:inherit}
.op b{display:block;font-size:13.5px;font-weight:600}
.op small{display:block;font-size:11px;color:var(--tinta-dim);margin-top:2px;line-height:1.3}
.op.on{border-color:#5BC8B4;background:rgba(91,200,180,.12)}
.op.on b{color:#5BC8B4}
.crear{display:flex;align-items:center;gap:13px;padding:16px;margin:0 0 14px;
  border:1px dashed var(--linea);border-radius:18px;color:inherit;text-decoration:none}
.crear .mas{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--fondo-2);
  border:1px solid var(--linea);color:#5BC8B4;font-size:20px;display:grid;place-items:center}
.crear b{display:block;font-size:15.5px}
.crear small{display:block;font-size:12.5px;color:var(--tinta-dim);margin-top:2px}
.lnk{background:none;border:0;padding:0;font:inherit;color:#5BC8B4;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.login{margin-top:12px}
.login input{width:100%;padding:11px 13px;margin-bottom:8px;border-radius:12px;
  border:1px solid var(--linea);background:var(--fondo);color:var(--tinta);
  font-family:var(--sans);font-size:15px}
.login input::placeholder{color:var(--tinta-dim)}
#err-login{color:#E08A72}

/* ── Modo claro: se activa con la clase, o solo si el sistema está en claro ── */
body.claro{--fondo:#F4F6F7;--fondo-2:#FFFFFF;--fondo-3:#EEF1F2;
  --tinta:#111A1F;--tinta-dim:#4E626C;--linea:rgba(17,26,31,.15);}
@media (prefers-color-scheme: light){
  body.auto{--fondo:#F4F6F7;--fondo-2:#FFFFFF;--fondo-3:#EEF1F2;
  --tinta:#111A1F;--tinta-dim:#4E626C;--linea:rgba(17,26,31,.15);}
}

/* Selector de color, arriba a la derecha */
header{position:relative}
.tema-mini{position:absolute;top:calc(12px + env(safe-area-inset-top));right:18px;
  display:flex;gap:2px;padding:2px;border-radius:999px;z-index:2}
.tm{width:28px;height:28px;border-radius:50%;border:0;background:transparent;
  cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.42;
  color:currentColor;font-family:var(--sans)}
.tm.on{opacity:1;background:rgba(127,127,127,.18)}

/* La barra y la cabecera siguen el color de fondo, sea cual sea el tema */
@supports not (background: color-mix(in srgb, red 50%, transparent)){
  nav{background:var(--fondo)}
  header{background:var(--fondo)}
}
</style>
</head>
<body>
<header>
  <div id="tema-zona"></div>
  <p class="eyebrow" id="saludo">Viajes</p>
  <h1>¿A dónde<br>vamos?</h1>
</header>
<main><div id="lista"></div><div id="pie"></div></main>

<script src="sync.js"></script>
<script>

/* ---- Modo de color, compartido por todas las apps ---- */
const TEMA = {
  get valor(){ try { return localStorage.getItem("tema_viajes") || "auto"; } catch { return "auto"; } },
  set valor(v){ try { localStorage.setItem("tema_viajes", v); } catch {}; this.aplica(); },
  pintaMini(){
    const z = document.getElementById("tema-zona");
    if (!z) return;
    z.innerHTML = this.mini();
    z.querySelectorAll("[data-tema]").forEach(b =>
      b.addEventListener("click", () => { TEMA.valor = b.dataset.tema; TEMA.pintaMini(); }));
  },
  aplica(){
    const v = this.valor;
    document.body.classList.toggle("claro", v === "claro");
    document.body.classList.toggle("auto",  v === "auto");
    const m = document.querySelector('meta[name="theme-color"]');
    if (!m) return;
    const oscuro = m.dataset.oscuro || m.getAttribute("content");
    if (!m.dataset.oscuro) m.dataset.oscuro = oscuro;
    const claroDeVerdad = v === "claro" ||
      (v === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
    m.setAttribute("content", claroDeVerdad ? "#F4F6F7" : m.dataset.oscuro);
  },
  mini(){
    const v = this.valor;
    const b = (id, t, etiqueta) =>
      `<button class="tm${v === id ? " on" : ""}" data-tema="${id}" aria-label="${etiqueta}" title="${etiqueta}">${t}</button>`;
    return `<div class="tema-mini">${b("auto","◐","Automático")}${b("claro","☀","Claro")}${b("oscuro","☾","Oscuro")}</div>`;
  },
  opciones(){
    const v = this.valor;
    const b = (id, t, sub) => `<button class="op${v === id ? " on" : ""}" data-tema="${id}"><b>${t}</b><small>${sub}</small></button>`;
    return `<div class="ops">${b("auto","Automático","Como el móvil")}${b("claro","Claro","Para el sol")}${b("oscuro","Oscuro","Para la noche")}</div>`;
  },
  engancha(volver){
    document.querySelectorAll("[data-tema]").forEach(x =>
      x.addEventListener("click", () => { TEMA.valor = x.dataset.tema; volver && volver(); }));
  }
};
if (window.matchMedia)
  matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => TEMA.aplica());
const VIAJES = [
  { id:"eslovenia", n:"Eslovenia y Venecia", ruta:"eslovenia/",
    desde:"2026-07-18", hasta:"2026-07-29", acento:"#4FC3B8",
    img:"img/eslovenia-portada.svg" },

  { id:"asturias", n:"Asturias occidental", ruta:"asturias/",
    desde:"", hasta:"", acento:"#7FB069",
    art:`<svg viewBox="0 0 400 104" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="104" fill="#0F1E14"/>
      <path d="M0 104L110 20l70 50 60-36 160 70z" fill="#1A2E20"/>
      <path d="M0 104L150 48l130 56z" fill="#24422A"/>
      <ellipse cx="120" cy="80" rx="46" ry="11" fill="#5AA9C4" opacity=".55"/>
      <g fill="#0F1E14"><path d="M60 70l10-15 10 15z"/><path d="M300 96l12-18 12 18z"/></g>
      <g stroke="#C89B3C" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M250 104h60l-40-13h62"/></g></svg>` }
];

const VERSION = "v83 · 28/07 07:38";
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const hoy = (() => { const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; })();

function textoFechas(v){
  if (!v.desde) return "Sin fechas todavía";
  const a = new Date(v.desde+"T12:00:00"), b = new Date(v.hasta+"T12:00:00");
  return `${a.getDate()} ${MESES[a.getMonth()]} — ${b.getDate()} ${MESES[b.getMonth()]} ${b.getFullYear()}`;
}
function estado(v){
  if (!v.desde) return ["futuro","Por planear"];
  if (hoy < v.desde) return ["futuro","Próximamente"];
  if (hoy > v.hasta) return ["hecho","Terminado"];
  const d = Math.round((new Date(hoy) - new Date(v.desde)) / 86400000) + 1;
  return ["curso", `En curso · día ${d}`];
}

function propios(){
  try { return (JSON.parse(localStorage.getItem("viajes_propios")) || []).map(v => ({
    id:v.id, n:v.nombre, ruta:`viaje/?id=${v.id}`, desde:v.desde||"", hasta:v.hasta||"",
    acento:"#5BC8B4", propio:true, ndias:(v.dias||[]).length,
    art:`<svg viewBox="0 0 400 104" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="104" fill="#101C22"/>
      <path d="M0 104L120 34l70 42 60-26 150 54z" fill="#1A2A32"/>
      <path d="M0 104L160 58l140 46z" fill="#223A42"/>
      <g stroke="#5BC8B4" stroke-width="2.4" fill="none" stroke-linecap="round"
         stroke-dasharray="3 6" opacity=".85"><path d="M40 92 L130 60 L230 74 L340 40"/></g>
      <g fill="#5BC8B4"><circle cx="40" cy="92" r="4"/><circle cx="130" cy="60" r="4"/>
        <circle cx="230" cy="74" r="4"/><circle cx="340" cy="40" r="4"/></g></svg>` })); }
  catch { return []; }
}

let TODOS = VIAJES.concat(propios());

function pintaLista(){
  document.getElementById("lista").innerHTML = TODOS.map(v => {
    const [cls, txt] = estado(v);
    const txt2 = v.propio && !v.desde
      ? `${v.ndias} día${v.ndias === 1 ? "" : "s"} · sin fechas` : txt;
    return `<a class="viaje ${cls}" href="${v.ruta}" style="--acento:${v.acento}">
      ${v.img ? `<img class="art" src="${v.img}" alt="${v.n}" loading="lazy">` : `<span class="art">${v.art}</span>`}
      <span class="cuerpo">
        <h2>${v.n}</h2>
        <p class="fechas">${textoFechas(v)}</p>
        <span class="estado"><span class="punto"></span>${txt2}</span>
        <span class="flecha">→</span>
      </span>
    </a>`;
  }).join("");

  const enCurso = TODOS.find(v => estado(v)[0] === "curso");
  document.getElementById("saludo").textContent = enCurso ? "Viaje en curso" : "Viajes";
}

function pintaPie(){
  document.getElementById("pie").innerHTML = `
    <a class="crear" href="crear/">
      <span class="mas">+</span>
      <span><b>Crear un viaje</b><small>Días, paradas y navegación, montado por ti</small></span>
    </a>
    <div class="mantenimiento">
      <p class="ver">Versión ${VERSION} · <span id="nube"></span></p>
      <button class="btn-act" id="btn-actualizar">Buscar actualización</button>
      <button class="btn-act ligero" id="btn-compartir">Compartir la app</button>
      <p class="nota" style="margin-top:10px">Actualiza esta portada y los viajes a la vez.</p>
      <div id="cuenta"></div>

    </div>
    <p class="nota">Cada viaje funciona sin cobertura una vez abierto con datos. Puedes añadir cualquiera a la pantalla de inicio por separado.</p>`;

  ponEstado(ultimoEstado);
  document.getElementById("btn-compartir").addEventListener("click", async () => {
    const b = document.getElementById("btn-compartir");
    const url = location.origin + location.pathname;
    const texto = `Apps de viaje que funcionan sin cobertura: itinerario, navegación, ` +
                  `qué hay cerca y diario del viaje.\n\n${url}\n\n` +
                  `Se abre en el navegador. Para tenerla como una app: Compartir → Añadir a pantalla de inicio.`;
    try {
      if (navigator.share) await navigator.share({ title:"Viajes", text:texto, url });
      else { await navigator.clipboard.writeText(url); b.textContent = "Enlace copiado"; }
    } catch {}
    setTimeout(() => { b.textContent = "Compartir la app"; }, 2500);
  });

  document.getElementById("btn-actualizar").addEventListener("click", async e => {
    const b = e.target;
    b.textContent = "Limpiando…";
    try {
      if ("serviceWorker" in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if (window.caches){
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k)));
      }
    } catch {}
    b.textContent = "Recargando…";
    location.replace(location.pathname + "?v=" + Date.now());
  });
}

/* ---- Nube ---- */
let ultimoEstado = { txt:"comprobando…", ok:false };

function ponEstado(e){
  ultimoEstado = e;
  const el = document.getElementById("nube");
  if (!el) return;
  el.innerHTML = e.login ? `${e.txt} · <button class="lnk" id="abrir-login">entrar</button>` : e.txt;
  el.style.color = e.ok ? "#5BC8B4" : "";
  const b = document.getElementById("abrir-login");
  if (b) b.addEventListener("click", pintaLogin);
  pintaSalir(e);
}

function pintaSalir(e){
  const z = document.getElementById("cuenta");
  if (!z) return;
  z.innerHTML = e.ok && e.correo
    ? `<p class="nota" style="margin:8px 0 0">Conectado como ${e.correo} ·
       <button class="lnk" id="salir">salir</button></p>` : "";
  const s = document.getElementById("salir");
  if (s) s.addEventListener("click", async () => {
    await SYNC.salir();
    pintaNube();
  });
}

function pintaLogin(){
  const z = document.getElementById("cuenta");
  z.innerHTML = `
    <div class="login">
      <p class="nota" style="margin:0 0 10px">Entra con la misma cuenta de Gastos compartidos.
        En iOS, cada app de la pantalla de inicio guarda su sesión aparte.</p>
      <input type="email" id="correo" placeholder="tu@correo.com" autocomplete="username"
             autocapitalize="none" spellcheck="false">
      <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn-act" id="hacer-login">Entrar</button>
      <p class="nota" id="err-login" style="margin:9px 0 0"></p>
    </div>`;
  document.getElementById("hacer-login").addEventListener("click", async () => {
    const b = document.getElementById("hacer-login");
    const err = document.getElementById("err-login");
    const correo = document.getElementById("correo").value.trim();
    const clave = document.getElementById("clave").value;
    if (!correo || !clave){ err.textContent = "Falta el correo o la contraseña."; return; }
    b.textContent = "Entrando…"; err.textContent = "";
    let r;
    try {
      if (typeof SYNC.entrar !== "function")
        throw new Error("La app está desactualizada. Pulsa «Buscar actualización».");
      r = await SYNC.entrar(correo, clave);
    } catch (ex){
      b.textContent = "Entrar";
      err.textContent = ex.message || "No se pudo entrar.";
      return;
    }
    if (!r.ok){ b.textContent = "Entrar"; err.textContent = r.txt; return; }
    z.innerHTML = "";
    pintaNube();
  });
  document.getElementById("clave").addEventListener("keydown", ev => {
    if (ev.key === "Enter") document.getElementById("hacer-login").click();
  });
}

async function pintaNube(){
  if (typeof SYNC === "undefined") return ponEstado({txt:"solo en este móvil", ok:false});
  // por si algo se quedara colgado pese a los topes
  const red = setTimeout(() => {
    const el = document.getElementById("nube");
    if (el && el.textContent.startsWith("comprobando"))
      ponEstado({txt:"la nube no responde · solo en este móvil", ok:false});
  }, 15000);
  try { await pintaNubeReal(); } finally { clearTimeout(red); }
}

async function pintaNubeReal(){
  try {
    const e = await SYNC.estado();
    ponEstado(e);
    if (!e.ok) return;
    const r = await SYNC.sincronizar();
    if (r.cambios){ TODOS = VIAJES.concat(propios()); pintaLista(); }
    const e2 = await SYNC.estado();
    ponEstado(e2);
  } catch { ponEstado({txt:"solo en este móvil", ok:false}); }
}

TEMA.aplica();
TEMA.pintaMini();
pintaLista();
pintaPie();
setTimeout(pintaNube, 300);

if ("serviceWorker" in navigator){
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      reg.update();
    } catch {}
  });
}
</script>
</body>
</html>
