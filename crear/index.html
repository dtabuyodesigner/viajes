<!DOCTYPE html>
<html lang="es">

<title>Crear viaje</title>
<style>
:root{
  --fondo:#12181C; --fondo-2:#1C252A; --fondo-3:#232E34;
  --tinta:#EDF1F3; --tinta-dim:#93A3AA; --linea:rgba(237,241,243,.13);
  --acento:#5BC8B4; --acento-dim:#3E8C7E; --ambar:#D9A233; --rojo:#C0503F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(90px + env(safe-area-inset-bottom))}
a{color:var(--acento);text-decoration:none}
:focus-visible{outline:2px solid var(--ambar);outline-offset:2px;border-radius:6px}

header{position:sticky;top:0;z-index:20;background:var(--fondo);
  padding:calc(14px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid var(--linea)}
.volver{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinta-dim);padding:5px 11px 5px 8px;
  border:1px solid var(--linea);border-radius:999px;margin-bottom:10px}
h1{font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:800;margin:0}
.sub{color:var(--tinta-dim);font-size:13.5px;margin:5px 0 0}

main{padding:18px 20px 20px;max-width:640px;margin:0 auto}
.campo{margin:0 0 15px}
.campo label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tinta-dim);margin-bottom:6px}
input[type=text],input[type=date],textarea,select{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--linea);
  background:var(--fondo-2);color:var(--tinta);font-family:var(--sans);font-size:15.5px}
textarea{resize:none;overflow:hidden;line-height:1.5}
input::placeholder,textarea::placeholder{color:#63757D}
.dos{display:flex;gap:10px}
.dos .campo{flex:1}

.dia{background:var(--fondo-2);border:1px solid var(--linea);border-radius:16px;
  padding:15px;margin:0 0 14px}
.dia-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dia-num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--acento);
  color:var(--fondo);font-family:var(--mono);font-size:12px;font-weight:700;
  display:grid;place-items:center}
.dia-cab h2{margin:0;font-size:16px;flex:1;letter-spacing:-.01em}
.parada{background:var(--fondo-3);border-radius:12px;padding:12px;margin:0 0 9px}
.parada .fila{display:flex;gap:8px;align-items:flex-start}
.parada .fila input:first-child{flex:0 0 82px}
.mini{font-size:13.5px !important;padding:9px 11px !important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 15px;border-radius:999px;border:1px solid var(--acento-dim);
  color:var(--acento);font-size:13.5px;font-weight:600;background:none;
  cursor:pointer;font-family:var(--sans)}
.btn.solid{background:var(--acento);color:var(--fondo);border-color:var(--acento)}
.btn.fino{padding:7px 12px;font-size:12.5px}
.btn.borrar{border-color:var(--rojo);color:var(--rojo)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));
  background:rgba(18,24,28,.95);backdrop-filter:blur(14px);border-top:1px solid var(--linea)}
.barra .btn{flex:1}

.aviso{display:flex;gap:11px;padding:13px 14px;border-radius:12px;margin:0 0 18px;

.aviso .ic{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--ambar);

.aviso p{margin:0;font-size:13px;line-height:1.5;color:#E4D6B8}
.aviso p a{color:#F0DFA8;text-decoration:underline}

.aviso.ok .ic{background:var(--acento)}
.aviso.ok p{color:#BFE8DF}
.aviso.ok p a{color:#8FE0D0}
.nota{font-size:13px;color:var(--tinta-dim);line-height:1.5;margin:10px 0 0}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;

.vacio{color:var(--tinta-dim);font-size:14px;padding:14px 0}
.ok{color:var(--acento)}

  try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; }

/* ---- Fotos: se comprimen antes de guardar ---- */
function comprimir(archivo, maxLado = 900, calidad = 0.72){
  return new Promise((ok, mal) => {
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width:a, height:b } = img;
        const f = Math.min(1, maxLado / Math.max(a, b));
        a = Math.round(a * f); b = Math.round(b * f);
        const c = document.createElement("canvas");
        c.width = a; c.height = b;
        c.getContext("2d").drawImage(img, 0, 0, a, b);
        ok(c.toDataURL("image/jpeg", calidad));
      };
      img.onerror = mal;
      img.src = lector.result;
    };
    lector.onerror = mal;
    lector.readAsDataURL(archivo);
  });
}

/* ---- Buscar un sitio en Wikipedia ---- */
async function buscarSitio(texto, fuente = "wikipedia"){
  const base = fuente === "wikivoyage"
    ? "https://es.wikivoyage.org/w/api.php"
    : "https://es.wikipedia.org/w/api.php";
  const url = base + "?" + new URLSearchParams({
    action:"query", format:"json", origin:"*",
    generator:"search", gsrsearch:texto, gsrlimit:"3",
    prop:"extracts|pageimages|coordinates",
    exintro:"1", explaintext:"1", exsentences:"3",
    piprop:"thumbnail", pithumbsize:"640"
  });
  const ctrl = new AbortController();
  const corte = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(corte);
    if (!r.ok) throw new Error("respuesta " + r.status);
    const d = await r.json();
    const paginas = d?.query?.pages;
    if (!paginas) return [];
    return Object.values(paginas)
      .sort((a,b) => (a.index||0) - (b.index||0))
      .map(p => ({
        titulo: p.title,
        texto: (p.extract || "").trim(),
        imagen: p.thumbnail?.source || "",
        xy: p.coordinates?.[0] ? `${p.coordinates[0].lat},${p.coordinates[0].lon}` : ""
      }))
      .filter(p => p.texto || p.imagen);
  } catch (e){
    clearTimeout(corte);
    throw e;
  }
}

/* ---- Preparar la petición para una IA ---- */
function plantilla(d){
  return `Móntame un viaje bien organizado y devuélvemelo en Markdown, con el formato exacto de abajo.

DESTINO: ${d.destino}
DÍAS: ${d.dias}
SALGO Y VUELVO A: ${d.salida || "sin especificar"}
CÓMO VIAJO: ${d.como || "sin especificar"}
QUÉ ME INTERESA: ${d.interes || "un poco de todo"}
RITMO: ${d.ritmo}
MÁXIMO AL VOLANTE: unas ${d.coche} horas al día
${d.extra ? "OTRAS COSAS: " + d.extra : ""}

═══ CÓMO QUIERO QUE ESTÉ ORGANIZADO ═══

1. RECORRIDO COHERENTE
   Traza un círculo, en un sentido o en el otro, o una línea limpia.
   Nunca ir y volver por el mismo tramo, ni cruzar la zona de lado a lado
   dos veces. Cada día debe dejarme más cerca del siguiente.

2. POCAS BASES, MÁS NOCHES
   Prioriza quedarte 2 o 3 noches en el mismo alojamiento y salir desde allí,
   antes que cambiar de sitio cada noche. Cambiar de base cuesta media mañana.
   Cambia solo cuando el salto geográfico lo justifique de verdad.
   Los alojamientos, cerca de lo que se visita ese día, no a 40 minutos.

3. TIEMPO AL VOLANTE
   Ningún día debe pasar mucho de ${d.coche} horas de coche.
   Escribe en cada día los kilómetros y el tiempo aproximados.
   Cuenta que en carretera de montaña se va mucho más lento de lo que dice el mapa.

4. LO DE HORA FIJA, PRIMERO
   Si algo tiene visita guiada, entrada con hora, ferri o último teleférico,
   colócalo como ancla del día y ordena lo demás alrededor. Dilo en la nota.

5. UN IMPRESCINDIBLE POR DÍA
   Marca con ★ al principio la parada que no habría que perderse ese día.

6. RITMO ALTERNO
   No pongas dos jornadas exigentes seguidas. Después de un día largo,
   uno suave. Y evita amontonar: entre 2 y 4 paradas de verdad por día.

7. PRIMERO Y ÚLTIMO DÍA REALISTAS
   El día de llegada, poco y cerca. El de vuelta, con margen de sobra
   y sin nada que no se pueda saltar.

8. MASIFICACIÓN
   En los sitios famosos, di a qué hora conviene ir para no coincidir con todos.

9. PLAN B
   En los días de montaña o de mar, añade al final una línea
   «Si llueve:» con una alternativa cercana a cubierto o suave.

10. LO PRÁCTICO
    Dónde llenar la nevera, dónde repostar antes de meterse en zona vacía,
    aparcamientos que se llenan pronto y si son de pago.

# Nombre del viaje
Salida: punto de partida

## Día 1 — Título de la jornada
Duermes en: pueblo o ciudad
Coche: 120 km · 2 h

- **Mañana** · ★ Nombre del sitio — Qué es y lo práctico que haya que saber. [Nombre exacto para el GPS]
- **Tarde** · Otro sitio — Explicación breve. [Nombre para el GPS]
- Si llueve: alternativa a cubierto por la zona.

## Día 2 — Título
Duermes en: el mismo sitio si no hay que moverse

REGLAS DE FORMATO:
- Exactamente ${d.dias} apartados «## Día».
- Cada parada empieza por «- », hora en **negrita**, luego « · », nombre, « — » y la explicación.
- Entre corchetes al final, el nombre que un GPS encuentre, con topónimo local si ayuda.
- No inventes horarios ni precios exactos si no estás seguro: di «comprobar» en su lugar.
- Nada de texto fuera de ese formato: ni introducción ni despedida.`;
}

/* ---- El viaje, como documento legible ---- */
function aMarkdown(v){
  const L = [`# ${v.nombre || "Viaje"}`];
  if (v.salida) L.push(`Salida: ${v.salida}`);
  if (v.desde)  L.push(`Fechas: ${v.desde}${v.hasta ? " a " + v.hasta : ""}`);
  L.push("");
  (v.dias || []).forEach((d, i) => {
    L.push(`## Día ${i+1} — ${d.t || "Sin título"}`);
    if (d.dest) L.push(`Duermes en: ${d.dest}`);
    if (d.km)   L.push(`Coche: ${d.km}`);
    L.push("");
    (d.paradas || []).forEach(p => {
      let l = "- ";
      if (p.h) l += `**${p.h}** · `;
      if (p.key) l += "★ ";
      l += p.txt || "";
      if (p.n) l += ` — ${p.n}`;
      if (p.mapa && p.mapa !== p.txt) l += ` [${p.mapa}]`;
      L.push(l);
    });
    if (d.lluvia) L.push(`- Si llueve: ${d.lluvia}`);
    L.push("");
  });
  return L.join("\n");
}

/* ---- Importar: aguanta lo que devuelva cualquier IA ---- */
function extraerJSON(texto){
  let t = String(texto || "").trim();
  // quita bloques de código y preámbulos del tipo "Aquí tienes tu viaje:"
  const bloque = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (bloque) t = bloque[1].trim();
  const abre = t.indexOf("{"), cierra = t.lastIndexOf("}");
  if (abre === -1 || cierra === -1 || cierra < abre) return null;
  t = t.slice(abre, cierra + 1);
  try { return JSON.parse(t); } catch {}
  // último intento: comillas tipográficas y comas colgando
  try {
    return JSON.parse(t.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'")
                       .replace(/,\s*([}\]])/g, "$1"));
  } catch { return null; }
}

function leerMarkdown(texto){
  const lineas = String(texto || "").split("\n");
  const v = { nombre:"", salida:"", desde:"", hasta:"", dias:[] };
  let dia = null;

  for (let cruda of lineas){
    const l = cruda.trim();
    if (!l) continue;

    // # Nombre del viaje
    let m = l.match(/^#\s+(.+)$/);
    if (m && !l.startsWith("##")){ v.nombre = m[1].trim(); continue; }

    // ## Día 1 — Título
    m = l.match(/^##+\s*(?:d[ií]a\s*\d+\s*[—–\-:.]?\s*)?(.*)$/i);
    if (m && /^##/.test(l)){
      dia = { t: m[1].trim(), dest:"", paradas:[] };
      v.dias.push(dia);
      continue;
    }

    // Salida: / Duermes en:
    m = l.match(/^\**\s*salida\s*:\**\s*(.+)$/i);
    if (m){ v.salida = m[1].replace(/\*/g,"").trim(); continue; }
    m = l.match(/^\**\s*(?:duermes?\s+en|noche|alojamiento)\s*:\**\s*(.+)$/i);
    if (m && dia){ dia.dest = m[1].replace(/\*/g,"").trim(); continue; }

    m = l.match(/^\**\s*(?:coche|conducci[óo]n|trayecto|km)\s*:\**\s*(.+)$/i);
    if (m && dia){ dia.km = m[1].replace(/\*/g,"").trim(); continue; }

    // - **Hora** · Sitio — Nota [GPS]
    m = l.match(/^[-*•]\s+(.*)$/);
    if (m && dia){
      let resto = m[1];
      let h = "", mapa = "", n = "";

      const gps = resto.match(/\[([^\]]+)\]\s*$/);
      if (gps){ mapa = gps[1].trim(); resto = resto.slice(0, gps.index).trim(); }

      const hora = resto.match(/^\*\*([^*]+)\*\*\s*[·:.\-–—]?\s*/);
      if (hora){ h = hora[1].trim(); resto = resto.slice(hora[0].length); }

      // "Si llueve:" es plan B del día, no una parada
      const lluvia = resto.match(/^\**\s*si\s+llueve\s*:?\**\s*(.+)$/i);
      if (lluvia){ dia.lluvia = lluvia[1].replace(/\*/g,"").trim(); continue; }

      const corte = resto.split(/\s+[—–]\s+|\s+-\s+/);
      let txt = (corte.shift() || "").replace(/\*/g,"").trim();
      n = corte.join(" — ").replace(/\*/g,"").trim();
      const clave = /^[★*]\s*/.test(txt);
      txt = txt.replace(/^[★*]\s*/, "");
      if (txt) dia.paradas.push({ h, txt, n, mapa: mapa || txt, key: clave || undefined });
    }
  }
  v.dias = v.dias.filter(d => d.paradas.length || d.t);
  return v.dias.length ? v : null;
}

function normalizar(v){
  const texto = x => typeof x === "string" ? x : (x == null ? "" : String(x));
  const dias = Array.isArray(v.dias) ? v.dias : [];
  return {
    id: nuevoId(),
    nombre: texto(v.nombre || v.titulo || "Viaje sin nombre"),
    desde: texto(v.desde || ""), hasta: texto(v.hasta || ""),
    salida: texto(v.salida || v.origen || ""),
    actualizado: new Date().toISOString(),
    dias: dias.map(d => ({
      t: texto(d.t || d.titulo || d.nombre || ""),
      dest: texto(d.dest || d.destino || d.duerme || ""),
      km: texto(d.km || ""),
      lluvia: texto(d.lluvia || ""),
      paradas: (Array.isArray(d.paradas) ? d.paradas : []).map(p => ({
        h: texto(p.h || p.hora || ""),
        txt: texto(p.txt || p.texto || p.nombre || p.titulo || ""),
        n: texto(p.n || p.nota || p.descripcion || ""),
        mapa: texto(p.mapa || p.gps || p.buscar || p.txt || p.nombre || ""),
        key: !!p.key
      })).filter(p => p.txt)
    }))
  };
}

document.getElementById("importar").addEventListener("click", () => {
  const txt = prompt("Pega aquí lo que te haya devuelto la IA (o un viaje exportado):");
  if (!txt) return;
  const crudo = extraerJSON(txt) || leerMarkdown(txt);
  if (!crudo){
    alert("No he encontrado ningún viaje en ese texto.\n\nCopia la respuesta entera de la IA, desde el título hasta el último día.");
    return;
  }
  const v = normalizar(crudo);
  if (!v.dias.length){
    alert("He leído el texto pero no trae ningún día con paradas.");
    return;
  }
  const paradas = v.dias.reduce((n,d) => n + d.paradas.length, 0);
  if (!confirm(`Voy a importar «${v.nombre}»: ${v.dias.length} días y ${paradas} paradas.\n\n¿Lo añado?`)) return;
  const todos = leerTodos(); todos.push(v); guardarTodos(todos);
  if (typeof SYNC !== "undefined") SYNC.subir(v).catch(()=>{});
  location.href = "?id=" + v.id;
});

document.getElementById("eliminar").addEventListener("click", async () => {
  if (!confirm("¿Eliminar este viaje del móvil? No se puede deshacer.")) return;
  guardarTodos(leerTodos().filter(v => v.id !== viaje.id));
  if (typeof SYNC !== "undefined") { try { await SYNC.borrar(viaje.id); } catch {} }
  location.href = "../";
});

window.addEventListener("beforeunload", e => {
  if (pendiente){ e.preventDefault(); e.returnValue = ""; }
});

async function pintaAvisoNube(){
  const z = document.getElementById("aviso-nube");
  if (!z) return;
  const pinta = (clase, icono, texto) =>
    z.innerHTML = `<div class="aviso ${clase}"><span class="ic">${icono}</span><p>${texto}</p></div>`;

  pinta("", "…", "Comprobando si se puede sincronizar…");
  if (typeof SYNC === "undefined")
    return pinta("", "!", "El viaje se guarda en este móvil. Para que lo vea otra persona, expórtalo.");
  try {
    const e = await SYNC.estado();
    if (e.ok) pinta("ok", "✓",
      `Se guarda aquí y se sube a la nube. Pilar lo verá en su móvil en cuanto abra la app, sin hacer nada.`);
    else if (e.login) pinta("", "!",
      `Sin sesión: por ahora solo se guarda en este móvil. Entra desde <a href="../">Viajes</a> para que lo vea Pilar.`);
    else pinta("", "!",
      `Sin conexión: se guarda aquí y subirá solo cuando haya cobertura.`);
  } catch {
    pinta("", "!", "El viaje se guarda en este móvil.");
  }
}

pintaDias();
setTimeout(pintaAvisoNube, 300);
</script>
